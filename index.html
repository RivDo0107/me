<div class="app" id="app">
<header class="topbar">
  <a class="brand" href="#" onclick="navigate('home');return false"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M4 10v4M8 6v12M12 3v18M16 7v10M20 10v4" stroke-linecap="round"/></svg></span>vonica<span style="color:var(--rose)">.</span></a>

  <div class="search"><span>⌕</span><input id="globalSearch" placeholder="Tìm podcast, chủ đề, tác giả..." onkeydown="if(event.key==='Enter'){state.search=this.value;navigate('explore')}"></div>

    <button class="iconbtn" onclick="toggleTheme()" title="Theme">☼</button>

    <button class="iconbtn" id="dmBtn" onclick="navigate('messages')" title="Messages">✉<sup id="dmCount" style="font-size:9px;color:var(--rose)"></sup></button>
    <button class="iconbtn" onclick="navigate('notifications')" title="Notifications">🔔<sup id="notificationCount" style="font-size:9px;color:var(--rose)"></sup></button>
    <button class="userline outline" id="profileTop" onclick="navigate('profile')" style="padding:5px 10px"><span class="avatar">H</span><strong id="topName">Hà</strong></button>
  </div>
</header>
<div class="layout">
<aside class="sidebar">

  <div id="sidebarNav" class="nav"></div>
  <div class="sidebar-bottom"><strong>♡ A little space for you</strong><p id="sideQuote">Tìm một câu chuyện hợp với tâm trạng hôm nay.</p><button class="outline" style="width:100%;border-color:#d5a5bb" onclick="navigate('explore')" id="discoverBtn">Khám phá ngay ↗</button></div>
  <div style="font-size:11px;color:var(--muted);padding:20px 12px 0">VONICA PROTOTYPE · v1.1</div>
</aside>
<main class="main" id="main"></main>
</div>
<nav class="mobile-nav" id="mobileNav"></nav>
<div class="player" id="player">

function toast(msg,type=""){const el=document.createElement("div");el.className="toast "+type;el.textContent=msg;document.getElementById("toasts").appendChild(el);setTimeout(()=>el.remove(),type==="error"?7000:3600)}
function cover(p){return `<div class="cover ${p.cover||"c1"}"><span class="cover-icon">${p.icon||"🎙️"}</span></div>`}
function visiblePodcasts(){return state.podcasts.filter(p=>p.status==="approved"&&p.visibility==="public"&&!p.hidden)}
function canListen(p){return state.role==="admin"||canAccess(p)}
function canAccess(p){if(p.visibility==="private")return p.authorId===currentUserId();if(!p.price)return true;return state.transactions.some(x=>x.podcastId===p.id&&x.status==="success")||state.memberships.some(x=>x.active)}
function currentUserId(){return state.role==="creator"?11:state.role==="admin"?99:1}
function creatorAllTransactions(creatorId=11){return state.transactions.filter(x=>x.creatorId===creatorId||state.podcasts.some(p=>p.id===x.podcastId&&p.authorId===creatorId))}
function creatorEarnings(creatorId=11){const sales=creatorAllTransactions(creatorId).filter(x=>x.status==="success");const gross=sales.reduce((sum,x)=>sum+(Number(x.amount)||0),0);const fee=sales.reduce((sum,x)=>sum+(Number.isFinite(Number(x.feeAmount))&&x.feeAmount!==undefined?Number(x.feeAmount):Math.round((Number(x.amount)||0)*(Number(x.feeRate??state.feeRate)||0)/100)),0);const net=sales.reduce((sum,x)=>sum+(Number.isFinite(Number(x.creatorAmount))&&x.creatorAmount!==undefined?Number(x.creatorAmount):(Number(x.amount)||0)-(Number.isFinite(Number(x.feeAmount))&&x.feeAmount!==undefined?Number(x.feeAmount):Math.round((Number(x.amount)||0)*(Number(x.feeRate??state.feeRate)||0)/100))),0);const withdrawn=state.withdrawals.filter(w=>w.creatorId===creatorId&&w.status==="completed").reduce((sum,w)=>sum+(Number(w.amount)||0),0);return {gross,fee,net,withdrawn,available:Math.max(0,net-withdrawn),sales}}

function podcastTitle(p){return state.lang==="en"?(p.enTitle||p.title):p.title}
function podcastDesc(p){return state.lang==="en"?(p.enDesc||p.desc):p.desc}
function cardPodcast(p){return `<article class="card"><div onclick="openPodcast(${p.id})" style="cursor:pointer">${cover(p)}<div class="between" style="align-items:start"><div><div class="pod-title">${esc(podcastTitle(p))}</div><div class="meta">${esc(p.author)} · ${esc(p.category)}</div></div><span class="pill">${p.price?money(p.price):t("free")}</span></div></div><p style="font-size:12px;margin:10px 0">${esc(podcastDesc(p).slice(0,82))}${p.desc.length>82?"…":""}</p><div class="between"><span class="meta">★ ${p.rating||"—"} · ${(p.listeners||0).toLocaleString()} plays</span><button class="iconbtn" style="width:35px;height:35px" onclick="toggleFavorite(${p.id})" title="Favorite">${state.favorites.includes(p.id)?"♥":"♡"}</button></div><div class="card-actions">${p.price&&!canListen(p)?`<button class="primary" onclick="buyPodcast(${p.id})">♡ ${t("buy")}</button>`:`<button class="primary" onclick="listenPodcast(${p.id})">▶ ${t("play")}</button>`}<button class="outline" onclick="openPodcast(${p.id})">↗</button></div></article>`}
function pageHead(eyebrow,title,sub,actions=""){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="sub">${sub}</p></div><div class="row">${actions}</div></div>`}
function sectionHead(title,sub="",action=""){return `<div class="between" style="margin-bottom:14px"><div><h2 class="section-title">${title}</h2>${sub?`<p class="section-sub">${sub}</p>`:""}</div>${action}</div>`}
function statCard(icon,num,label,detail=""){return `<div class="card stat"><div class="stat-icon">${icon}</div><div><div class="stat-num">${num}</div><div class="stat-label">${label}</div>${detail?`<div class="meta" style="margin-top:4px">${detail}</div>`:""}</div></div>`}
function homePage(){const ps=visiblePodcasts();return `${`<section class="hero"><div><span class="pill" style="background:#fff9f7;color:#b84978">✦ ${state.lang==="vi"?"YOUR DAILY LISTENING RITUAL":"YOUR DAILY LISTENING RITUAL"}</span><h2>${state.lang==="vi"?"Một câu chuyện nhỏ. Một cảm xúc thật.":"A little story. A feeling that stays."}</h2><p>${state.lang==="vi"?"Khám phá những podcast khiến bạn thấy được lắng nghe — từ những phút bình yên đến ý tưởng mới mẻ.":"Discover podcasts that make you feel heard — from quiet moments to fresh ideas."}</p><div class="row" style="margin-top:20px"><button class="primary" onclick="navigate('explore')">${state.lang==="vi"?"Khám phá podcast":"Explore podcasts"} ↗</button><button class="outline" onclick="listenPodcast(${ps[0]?.id||1})">${state.lang==="vi"?"Nghe thử":"Listen to a preview"} ▶</button></div></div><div class="hero-art"><div class="orbit"><span class="podmic">🎙️</span></div><span class="float one">♡ made for your mood</span><span class="float two">♪ a softer kind of scroll</span></div></section>`}
<section class="section">${sectionHead(t("featured"),state.lang==="vi"?"Những câu chuyện được chọn lọc cho bạn":"Stories selected just for you",`<button class="outline" onclick="navigate('explore')">${t("viewAll")} ↗</button>`)}<div class="grid grid-3">${ps.filter(p=>p.featured).slice(0,3).map(cardPodcast).join("")}</div></section>
<section class="section">${sectionHead(t("latest"),state.lang==="vi"?"Những tập mới đang chờ bạn":"Fresh voices to spend time with",`<button class="outline" onclick="navigate('explore')">${t("viewAll")} ↗</button>`)}<div class="grid grid-3">${ps.slice().reverse().slice(0,3).map(cardPodcast).join("")}</div></section>
<section class="section">${sectionHead(t("popular"),state.lang==="vi"?"Được cộng đồng yêu thích":"Loved by the community")}<div class="grid grid-3">${ps.slice().sort((a,b)=>b.listeners-a.listeners).slice(0,3).map(cardPodcast).join("")}</div></section>`}
function explorePage(){const all=visiblePodcasts();let ps=all.filter(p=>(state.filter==="all"||(state.filter==="free"&&!p.price)||(state.filter==="paid"&&p.price))&&(state.category==="all"||p.category===state.category)&&(!state.search||(podcastTitle(p)+" "+p.author+" "+p.category+" "+p.desc).toLowerCase().includes(state.search.toLowerCase())));return `${pageHead("FIND YOUR NEXT FAVORITE",state.lang==="vi"?"Khám phá podcast":"Explore podcasts",state.lang==="vi"?"Tìm kiếm một ý tưởng, một giọng nói hay một câu chuyện hợp với bạn.":"Find an idea, a voice, or a story that feels like you.",`<button class="outline" onclick="navigate('community')">♡ ${t("community")}</button>`)}<div class="filterbar"><input placeholder="${t("searchPlaceholder")}" value="${esc(state.search)}" oninput="state.search=this.value;renderMainOnly()" style="flex:1;min-width:180px"><select onchange="state.category=this.value;renderMainOnly()"><option value="all">${state.lang==="vi"?"Tất cả danh mục":"All categories"}</option>${categories.map(c=>`<option ${state.category===c?"selected":""} value="${c}">${c}</option>`).join("")}</select><select onchange="state.filter=this.value;renderMainOnly()"><option value="all">${state.lang==="vi"?"Mọi mức giá":"All prices"}</option><option value="free" ${state.filter==="free"?"selected":""}>${t("free")}</option><option value="paid" ${state.filter==="paid"?"selected":""}>${t("paid")}</option></select></div><div class="between" style="margin-bottom:14px"><span class="meta">${ps.length} ${state.lang==="vi"?"podcast phù hợp":"podcasts found"}</span><div class="row">${categories.slice(0,5).map(c=>`<button class="softbtn" onclick="state.category='${c}';renderMainOnly()">${c}</button>`).join("")}</div></div><div class="grid grid-3">${ps.map(cardPodcast).join("")||`<div class="card empty" style="grid-column:1/-1"><div class="emoji">🔎</div><h3>${state.lang==="vi"?"Chưa tìm thấy podcast":"No podcasts found"}</h3><p>${state.lang==="vi"?"Thử thay đổi từ khóa hoặc bộ lọc nhé.":"Try another keyword or filter."}</p><button class="outline" onclick="state.search='';state.category='all';state.filter='all';render()">${state.lang==="vi"?"Xóa bộ lọc":"Clear filters"}</button></div>`}</div>`}
function libraryPage(){const tab=state.libraryTab||"history";let ids=tab==="favorites"?state.favorites:tab==="downloads"?(state.downloads||[]):tab==="playlists"?(state.playlists.find(x=>x.id===state.selectedPlaylist)?.podcastIds||state.playlists[0]?.podcastIds||[]):state.history.map(x=>x.podcastId);let ps=ids.map(id=>state.podcasts.find(p=>p.id===id)).filter(Boolean);return `${pageHead("YOUR SPACE",t("library"),state.lang==="vi"?"Tất cả những gì bạn đã nghe, lưu lại và muốn nghe tiếp.":"Everything you listened to, saved, or want to return to.",state.role==="listener"?`<button class="outline" onclick="navigate('myPodcasts')">♫ ${t("myPodcasts")}</button>`:"")}<div class="tabs">${[["history","◷ "+t("history")],["favorites","♡ "+t("favorites")],["playlists","☷ "+t("playlists")],["downloads","⇩ "+t("downloads")]].map(([v,l])=>`<button class="${tab===v?"active":""}" onclick="state.libraryTab='${v}';renderMainOnly()">${l}</button>`).join("")}</div>${tab==="playlists"?`<div class="card" style="margin-bottom:18px"><div class="between"><div><h3>☷ ${state.lang==="vi"?"Playlist của bạn":"Your playlists"}</h3><p class="meta">${state.playlists.length} playlists</p></div><button class="primary" onclick="createPlaylist()">＋ ${state.lang==="vi"?"Tạo playlist":"New playlist"}</button></div><div class="row">${state.playlists.map(pl=>`<button class="outline" onclick="state.selectedPlaylist=${pl.id};state.libraryTab='playlists';renderMainOnly()">♫ ${esc(pl.name)} (${pl.podcastIds.length})</button>`).join("")}</div></div>`:""}<div class="grid grid-3">${ps.map(cardPodcast).join("")||`<div class="card empty" style="grid-column:1/-1"><div class="emoji">♡</div><h3>${state.lang==="vi"?"Chưa có nội dung ở đây":"Nothing here yet"}</h3><p>${state.lang==="vi"?"Khám phá podcast và lưu lại những tập bạn yêu thích.":"Explore podcasts and save the ones you love."}</p><button class="primary" onclick="navigate('explore')">${t("explore")} ↗</button></div>`}</div>`}
function communityPage(){return `${pageHead("LISTEN TOGETHER",t("community"),state.lang==="vi"?"Một góc nhỏ để trò chuyện, chia sẻ và gặp những người cùng sở thích.":"A little corner to talk, share, and meet people with similar tastes.",`<button class="primary" onclick="createRoom()">＋ ${state.lang==="vi"?"Tạo phòng":"Create room"}</button>`)}<div class="grid grid-2">${state.rooms.map(r=>{const rp=r.podcastId?state.podcasts.find(p=>p.id===Number(r.podcastId)):null;return `<div class="card"><div class="between"><div class="stat-icon">💬</div>${statusPill(r.isOpen===false?"blocked":"active")}</div><h3 style="margin-top:14px">${esc(r.name)}</h3><p class="meta">${esc(r.topic)} · ${r.members}/10 ${state.lang==="vi"?"người":"members"}</p>${rp?`<p class="meta">🎧 ${esc(podcastTitle(rp))}${r.episodeTitle?` · ${esc(r.episodeTitle)}`:""}</p>`:""}<div class="row" style="margin-top:15px">${r.isOpen===false?`<button class="outline" disabled>${state.lang==="vi"?"Phòng đã đóng":"Room closed"}</button>`:`<button class="primary" onclick="${r.podcastId?`joinPodcastRoom(${r.id})`:`openRoom(${r.id})`}">${state.lang==="vi"?"Vào phòng":"Join room"} ↗</button>`}<button class="outline" onclick="reportRoom(${r.id})">${t("report")}</button></div></div>`}).join("")}</div><section class="section"><div class="card"><h3>♡ ${state.lang==="vi"?"Khám phá tác giả":"Discover creators"}</h3><div class="grid grid-2">${state.users.filter(u=>u.role==="creator").slice(0,4).map(u=>`<div class="userline" style="padding:10px 0"><div class="avatar" style="cursor:pointer" onclick="openProfile(${u.id})">${esc(u.avatar)}</div><div style="flex:1;cursor:pointer" onclick="openProfile(${u.id})"><strong>${esc(u.name)} ${u.verified?"✓":""}</strong><small>${esc(u.bio)}</small></div><button class="outline" onclick="toggleFollow(${u.id})">${state.following.includes(u.id)?(state.lang==="vi"?"Đang theo dõi":"Following"):t("follow")}</button></div>`).join("")}</div></div></section><section class="section"><div class="card"><h3>♙ ${state.lang==="vi"?"Gặp gỡ thành viên":"Meet members"}</h3><div class="grid grid-2">${state.users.filter(u=>u.role==="listener"&&u.id!==1).map(u=>personRow(u,isFriend(u.id)?`<button class="primary" onclick="openChat(${u.id})">✉ ${state.lang==="vi"?"Nhắn tin":"Message"}</button>`:reqOf(u.id)?`<span class="pill yellow">${state.lang==="vi"?"Chờ phản hồi":"Pending"}</span>`:`<button class="primary" onclick="sendFriendRequest(${u.id})">＋ ${state.lang==="vi"?"Kết bạn":"Add"}</button>`)).join("")}</div></div></section>`}
function profilePage(){const u=state.users.find(u=>u.id===currentUserId())||state.users[0];return `${pageHead("YOUR PROFILE",t("profile"),state.lang==="vi"?"Một hồ sơ nhỏ để mọi người hiểu bạn hơn.":"A little profile to help people know you better.")}<div class="split"><div class="card"><div class="userline" style="margin-bottom:22px"><div class="avatar" style="width:65px;height:65px;font-size:22px">${esc(u.avatar)}</div><div><h2 style="margin:0">${esc(u.name)}</h2><div class="meta">${roleLabel(u.role)} · ${u.verified?t("verified"):t("notVerified")}</div></div></div><form onsubmit="saveProfile(event)"><div class="form-grid"><div class="field"><label>${state.lang==="vi"?"Tên hiển thị":"Display name"}</label><input name="name" required value="${esc(u.name)}"></div><div class="field"><label>Email</label><input name="email" type="email" required value="${esc(u.email)}"></div><div class="field full"><label>${state.lang==="vi"?"Giới thiệu":"Bio"}</label><textarea name="bio">${esc(u.bio)}</textarea></div></div><div class="row" style="margin-top:16px"><button class="primary">${t("save")}</button><button type="button" class="outline" onclick="navigate('verification')">${state.lang==="vi"?"Xác minh hồ sơ":"Verify profile"} →</button></div></form></div><div class="card"><h3>✦ ${state.lang==="vi"?"Trạng thái hồ sơ":"Profile status"}</h3><div class="notice"><span>◉</span><div><strong>${u.verified?t("verified"):t("notVerified")}</strong><p>${state.lang==="vi"?"Hồ sơ cơ bản gồm tên hiển thị, ảnh đại diện, email và mô tả.":"Basic profile includes display name, avatar, email, and bio."}</p></div></div><h3 style="margin-top:22px">${state.lang==="vi"?"Hoạt động":"Activity"}</h3><div class="between"><span class="meta">${t("favorites")}</span><strong>${state.favorites.length}</strong></div><div class="between" style="margin-top:10px"><span class="meta">${state.lang==="vi"?"Đang theo dõi":"Following"}</span><strong>${state.following.length}</strong></div><div class="between" style="margin-top:10px"><span class="meta">${state.lang==="vi"?"Bạn bè":"Friends"}</span><strong>${state.friends.length}</strong></div></div></div>`}
function verificationPage(){const id=currentUserId();const req=state.verificationRequests.find(r=>r.userId===id);const u=state.users.find(u=>u.id===id)||state.users[0];return `${pageHead("PROFILE TRUST",t("verification"),state.lang==="vi"?"Xác minh hồ sơ bằng mã OTP gửi tới email đăng ký.":"Verify your profile with an OTP sent to your registered email.")}<div class="split"><div class="card"><h3>${state.lang==="vi"?"Thông tin xác minh cơ bản":"Basic verification details"}</h3><div class="notice"><span>✓</span><div><strong>${esc(u.name)}</strong><p>${esc(u.email)}</p><small>${esc(u.bio)}</small></div></div>${u.verified?`<div class="pill green">✓ ${t("verified")}</div>`:req&&req.status==="pending"?`<div class="notice"><span>◷</span><div><strong>${state.lang==="vi"?"Đã xác minh OTP · Chờ admin duyệt":"OTP verified · Awaiting admin review"}</strong><p>${esc(req.note||"")}</p></div></div>`:`<p>${state.lang==="vi"?"Nhấn gửi mã OTP. Trong bản demo, mã sẽ hiển thị trực tiếp để bạn kiểm thử; hệ thống chưa gửi email thật.":"Request an OTP. In this demo, the code is shown on screen for testing; no real email is sent."}</p><button class="primary" onclick="sendVerificationOtp()">${state.lang==="vi"?"Gửi mã OTP xác minh":"Send verification OTP"}</button>`}</div><div class="card"><h3>${state.lang==="vi"?"Quy trình xác minh":"Verification flow"}</h3><div class="notice"><span>1</span><div><strong>${state.lang==="vi"?"Gửi mã OTP":"Send OTP"}</strong><p>${state.lang==="vi"?"Mã xác minh được tạo cho email trong hồ sơ.":"A verification code is generated for the profile email."}</p></div></div><div class="notice"><span>2</span><div><strong>${state.lang==="vi"?"Nhập mã OTP":"Enter OTP"}</strong><p>${state.lang==="vi"?"Nhập mã 6 chữ số để xác nhận email.":"Enter the 6-digit code to confirm the email."}</p></div></div><div class="notice"><span>3</span><div><strong>${state.lang==="vi"?"Admin duyệt hồ sơ":"Admin reviews profile"}</strong><p>${state.lang==="vi"?"Sau khi OTP hợp lệ, yêu cầu được chuyển tới admin.":"After OTP validation, the request goes to admin."}</p></div></div></div></div>`}
function notificationsPage(){const ns=state.notifications.filter(n=>!n.role||n.role===state.role);return `${pageHead("UPDATES",t("notifications"),state.lang==="vi"?"Những cập nhật quan trọng trong không gian Vonica.":"Important updates from your Vonica space.",`<button class="outline" onclick="markAllRead()">${state.lang==="vi"?"Đánh dấu đã đọc":"Mark all read"}</button>`)}<div class="card">${ns.map(n=>`<div class="notice ${n.read?"":"unread"}"><span>${n.read?"♧":"●"}</span><div style="flex:1"><strong>${esc(n.title)}</strong><p>${esc(n.body)}</p><small>${esc(n.date)}</small></div>${n.read?"":`<button class="outline" onclick="markRead(${n.id})">${state.lang==="vi"?"Đã đọc":"Read"}</button>`}</div>`).join("")||`<div class="empty">♧<p>${t("noData")}</p></div>`}</div>`}
function settingsPage(){return `${pageHead("PREFERENCES",t("settings"),state.lang==="vi"?"Tùy chỉnh trải nghiệm theo cách bạn thích.":"Personalize your experience.")}<div class="grid grid-2"><div class="card"><h3>🌐 ${t("language")}</h3><p>${state.lang==="vi"?"Chuyển toàn bộ giao diện giữa tiếng Việt và tiếng Anh.":"Switch the interface between Vietnamese and English."}</p><div class="row"><button class="outline" onclick="setLang('vi')">🇻🇳 Tiếng Việt ${state.lang==="vi"?"✓":""}</button><button class="outline" onclick="setLang('en')">🇬🇧 English ${state.lang==="en"?"✓":""}</button></div></div><div class="card"><h3>☼ ${t("theme")}</h3><p>${state.lang==="vi"?"Chọn giao diện sáng hoặc tối.":"Choose light or dark appearance."}</p><div class="row"><button class="outline" onclick="setTheme('light')">☀ Light</button><button class="outline" onclick="setTheme('dark')">☾ Dark</button></div></div><div class="card"><h3>♧ ${state.lang==="vi"?"Dữ liệu prototype":"Prototype data"}</h3><p>${state.lang==="vi"?"Dữ liệu được lưu trong trình duyệt này. Bạn có thể khôi phục bộ dữ liệu mẫu.":"Data is saved in this browser. You can restore the sample dataset."}</p><button class="outline" onclick="resetData()">↻ ${state.lang==="vi"?"Khôi phục dữ liệu mẫu":"Restore sample data"}</button></div><div class="card"><h3>ⓘ ${state.lang==="vi"?"Thông tin hệ thống":"System information"}</h3><p>Vonica Prototype v1.0</p><div class="between"><span class="meta">Storage</span><span class="pill green">localStorage</span></div><div class="between" style="margin-top:8px"><span class="meta">Backend</span><span class="pill yellow">Mock</span></div><div class="between" style="margin-top:8px"><span class="meta">Payments</span><span class="pill yellow">Simulated</span></div></div></div>`}
function podcastDetail(id){const p=state.podcasts.find(p=>p.id===id);if(!p)return homePage();if(p.hidden&&state.role!=="admin"&&p.authorId!==currentUserId())return `${pageHead("PODCAST DETAILS",esc(podcastTitle(p)),"",`<button class="outline" onclick="navigate('explore')">← ${t("explore")}</button>`)}<div class="card empty"><div class="emoji">🚫</div><h3>${state.lang==="vi"?"Nội dung đã bị ẩn":"Content hidden"}</h3><p>${state.lang==="vi"?"Admin đã ẩn nội dung này sau khi xem xét báo cáo.":"An admin hid this content after reviewing a report."}</p></div>`;let access=canAccess(p);const listenOk=canListen(p);const adminReview=state.role==="admin";const rooms=(state.rooms||[]).filter(r=>Number(r.podcastId)===Number(p.id));const canDiscuss=access||p.authorId===currentUserId();const roomCards=rooms.map(r=>`<div class="notice"><span style="font-size:22px">${r.isOpen===false?"🔒":"💬"}</span><div style="flex:1;min-width:0"><strong>${esc(r.name)}</strong><p>${esc(r.episodeTitle||((state.lang==="vi"?"Toàn bộ podcast":"Full podcast")))} · ${Number(r.members||0)}/10 ${state.lang==="vi"?"người":"members"}</p><small>${r.isOpen===false?(state.lang==="vi"?"Phòng đã đóng":"Room closed"):(state.lang==="vi"?"Đang mở":"Open now")}</small></div>${r.isOpen===false?`<button class="outline" disabled>${state.lang==="vi"?"Đã đóng":"Closed"}</button>`:`<button class="primary" onclick="joinPodcastRoom(${r.id})">${state.lang==="vi"?"Tham gia":"Join"} ↗</button>`}</div>`).join("");return `${pageHead("PODCAST DETAILS",esc(podcastTitle(p)),`${esc(p.author)} · ${esc(p.category)}`,`<button class="outline" onclick="navigate('explore')">← ${t("explore")}</button>`)}<div class="split"><div class="card"><div class="cover ${p.cover}" style="aspect-ratio:1.8"><span class="cover-icon" style="font-size:72px">${p.icon}</span></div><div class="row"><span class="pill">${p.price?money(p.price):t("free")}</span>${p.visibility==="private"?`<span class="pill yellow">🔒 ${t("private")}</span>`:""}<span class="pill green">★ ${p.rating||"—"}</span></div><p>${esc(podcastDesc(p))}</p>${adminReview&&(p.price||p.visibility==="private"||p.status!=="approved")?`<div class="notice" style="margin:10px 0"><span>🛡</span><div><strong>${state.lang==="vi"?"Chế độ kiểm duyệt":"Moderation mode"}</strong><p>${state.lang==="vi"?`Admin nghe miễn phí để kiểm duyệt${p.price?` (nội dung có phí ${money(p.price)})`:""}. Không tạo giao dịch và không tính vào lượt nghe.`:`Admins listen for free for moderation${p.price?` (paid content ${money(p.price)})`:""}. No transaction is created and it does not count as a listen.`}</p></div></div>`:""}<div class="row"><button class="primary" onclick="${p.price&&!listenOk?`buyPodcast(${p.id})`:`listenPodcast(${p.id})`}">${p.price&&!listenOk?"♡ "+t("buy"):"▶ "+(adminReview?(state.lang==="vi"?"Nghe để kiểm duyệt":"Listen to review"):t("play"))}</button><button class="outline" onclick="toggleFavorite(${p.id})">${state.favorites.includes(p.id)?"♥":"♡"} ${t("favorites")}</button><button class="outline" onclick="toggleFollow(${p.authorId})">${state.following.includes(p.authorId)?"✓": "＋"} ${t("follow")}</button><button class="outline" onclick="openReview(${p.id})">★ ${t("rating")}</button><button class="outline" onclick="openReport(${p.id})">⚑ ${t("report")}</button></div></div><div class="card"><h3>🎙️ ${state.lang==="vi"?"Về tác giả":"About the creator"}</h3><div class="userline"><div class="avatar">${esc(p.author[0])}</div><div style="flex:1"><strong>${esc(p.author)}</strong><small>${p.authorId&&state.users.find(u=>u.id===p.authorId)?.verified?t("verified"):t("notVerified")}</small></div><button class="outline" onclick="toggleFollow(${p.authorId})">${state.following.includes(p.authorId)?"✓": "+"}</button></div><p>${esc(state.users.find(u=>u.id===p.authorId)?.bio||"Podcast creator on Vonica.")}</p><h3 style="margin-top:24px">♫ ${state.lang==="vi"?"Các tập podcast":"Episodes"} (${p.episodes.length})</h3>${p.episodes.map((e,i)=>`<div class="notice"><span>▶</span><div style="flex:1"><strong>${esc(e.title)}</strong><p>${formatTime(e.duration)}</p></div><button class="iconbtn" onclick="listenPodcast(${p.id},${e.id})">▶</button></div>`).join("")}</div></div><section class="section"><div class="card"><div class="between"><div><h3 style="margin:0">💬 ${state.lang==="vi"?"Phòng thảo luận của podcast":"Podcast discussion rooms"}</h3><p class="meta">${state.lang==="vi"?"Người nghe và tác giả có thể cùng nghe, trò chuyện theo từng nội dung podcast. Phòng tối đa 10 người.":"Listeners and creators can listen and chat about this podcast together. Up to 10 people per room."}</p></div>${canDiscuss?`<button class="primary" onclick="createRoom(${p.id})">＋ ${state.lang==="vi"?"Tạo phòng mới":"Create room"}</button>`:`${adminReview?`<span class="pill blue">🛡 ${state.lang==="vi"?"Admin chỉ xem để kiểm duyệt":"Admin view-only"}</span>`:`<span class="pill yellow">🔒 ${state.lang==="vi"?"Mua podcast để thảo luận":"Purchase to join discussion"}</span>`}`}</div>${rooms.length?roomCards:`<div class="empty"><div class="emoji">🎧</div><p>${state.lang==="vi"?"Chưa có phòng thảo luận mở cho podcast này.":"No discussion rooms are open for this podcast yet."}</p>${canDiscuss?`<button class="outline" onclick="createRoom(${p.id})">＋ ${state.lang==="vi"?"Mở phòng đầu tiên":"Open the first room"}</button>`:""}</div>`}</div></section><section class="section"><div class="card"><h3>★ ${state.lang==="vi"?"Đánh giá từ cộng đồng":"Community reviews"}</h3>${state.reviews.filter(r=>r.podcastId===id).map(r=>`<div class="notice"><span>★</span><div><strong>${esc(r.name)} · ${r.rating}/5</strong><p>${esc(r.comment)}</p></div></div>`).join("")||`<p class="meta">${state.lang==="vi"?"Chưa có đánh giá. Hãy là người đầu tiên chia sẻ cảm nhận.":"No reviews yet. Be the first to share your thoughts."}</p>`}</div></section>`}
function creatorDashboard(){const mine=state.podcasts.filter(p=>p.authorId===11);const earnings=creatorEarnings(11);const gross=earnings.gross;const net=earnings.net;return `${pageHead("YOUR CREATOR SPACE",t("creatorHome"),state.lang==="vi"?"Theo dõi nội dung, kết nối với người nghe và phát triển kênh của bạn.":"Track your content, connect with listeners, and grow your channel.",`<button class="primary" onclick="openPodcastForm()">＋ ${t("create")}</button>`)}<div class="grid grid-4">${statCard("♫",mine.length,t("totalPodcasts"),"↑ 2 this month")}${statCard("◉",mine.reduce((s,p)=>s+p.listeners,0).toLocaleString(),state.lang==="vi"?"Lượt nghe":"Total plays","Across your shows")}${statCard("★","4.9",state.lang==="vi"?"Đánh giá trung bình":"Average rating","From listeners")}${statCard("↗",money(net),t("revenue"),`${state.feeRate}% platform fee`)}</div><section class="section"><div class="split"><div class="card"><div class="between"><h3>${state.lang==="vi"?"Hiệu suất 7 ngày":"7-day performance"}</h3><span class="pill green">+18.4%</span></div><div class="mini-chart">${[38,58,46,72,55,88,68,95,74,100,82,90].map(h=>`<i style="height:${h}%"></i>`).join("")}</div><div class="between meta"><span>Mon</span><span>Sun</span></div></div><div class="card"><h3>${state.lang==="vi"?"Việc cần làm":"Your next steps"}</h3><div class="notice"><span>✓</span><div><strong>${state.lang==="vi"?"Hoàn thiện hồ sơ":"Complete your profile"}</strong><p>2/3 ${state.lang==="vi"?"bước hoàn thành":"steps complete"}</p></div></div><div class="notice"><span>◷</span><div><strong>${state.lang==="vi"?"Kiểm tra hàng đợi duyệt":"Check review queue"}</strong><p>${state.podcasts.filter(p=>p.authorId===11&&p.status==="pending").length} ${state.lang==="vi"?"podcast đang chờ":"podcasts pending"}</p></div></div><button class="outline" onclick="navigate('verification')">${state.lang==="vi"?"Xác minh hồ sơ":"Verify profile"} →</button></div></div></section><section class="section">${sectionHead(state.lang==="vi"?"Podcast gần đây":"Recent podcasts","",`<button class="outline" onclick="navigate('myPodcasts')">${t("viewAll")}</button>`)}<div class="table-wrap"><table><thead><tr><th>${t("title")}</th><th>${t("status")}</th><th>${t("listeners")}</th><th>${t("price")}</th><th>${t("actions")}</th></tr></thead><tbody>${mine.map(p=>`<tr><td><strong>${esc(p.title)}</strong><div class="meta">${esc(p.category)}</div></td><td>${statusPill(p.status)}</td><td>${p.listeners.toLocaleString()}</td><td>${p.price?money(p.price):t("free")}</td><td><button class="outline" onclick="editPodcast(${p.id})">${t("edit")}</button></td></tr>`).join("")}</tbody></table></div></section>`}
function myPodcastsListener(){const vi=state.lang==="vi";const mine=state.podcasts.filter(p=>p.authorId===currentUserId());return `${pageHead("YOUR SPACE",t("myPodcasts"),vi?"Tạo và quản lý podcast của riêng bạn. Podcast của người nghe luôn ở chế độ riêng tư.":"Create and manage your own podcasts. Listener podcasts are always private.",`<button class="primary" onclick="openPodcastForm()">＋ ${t("create")}</button>`)}<div class="notice"><span>🔒</span><div><strong>${vi?"Chỉ mình bạn nghe được":"Only you can listen"}</strong><p>${vi?"Podcast bạn tạo sẽ không xuất hiện ở Khám phá, không cần kiểm duyệt và không thể bán.":"Podcasts you create won't appear in Explore, need no moderation and can't be sold."}</p></div></div><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>${t("title")}</th><th>${t("category")}</th><th>Visibility</th><th>${vi?"Số tập":"Episodes"}</th><th>${t("actions")}</th></tr></thead><tbody>${mine.map(p=>`<tr><td><div class="userline"><span style="font-size:23px">${p.icon}</span><strong>${esc(p.title)}</strong></div></td><td>${esc(p.category)}</td><td><span class="pill yellow">🔒 ${t("private")}</span></td><td>${p.episodes.length}</td><td><div class="row"><button class="outline" onclick="listenPodcast(${p.id})">▶</button><button class="outline" onclick="editPodcast(${p.id})">${t("edit")}</button><button class="outline" onclick="manageEpisodes(${p.id})">♫</button><button class="danger" onclick="deletePodcast(${p.id})">×</button></div></td></tr>`).join("")||`<tr><td colspan="5">${vi?"Bạn chưa tạo podcast nào. Bấm “Tạo podcast” để bắt đầu.":"You haven't created any podcasts yet."}</td></tr>`}</tbody></table></div>`}
function myPodcastsPage(){if(state.role==="listener")return myPodcastsListener();let mine=state.podcasts.filter(p=>p.authorId===11);const tab=state.creatorFilter||"all";mine=mine.filter(p=>tab==="all"||p.status===tab||p.visibility===tab);return `${pageHead("CONTENT MANAGEMENT",t("myPodcasts"),state.lang==="vi"?"Quản lý bản nháp, nội dung đang duyệt và podcast đã phát hành.":"Manage drafts, pending content, and published podcasts.",`<button class="primary" onclick="openPodcastForm()">＋ ${t("create")}</button>`)}<div class="tabs">${[["all",t("all")],["approved",t("approved")],["pending",t("pending")],["draft",t("draft")],["private",t("private")]].map(([v,l])=>`<button class="${tab===v?"active":""}" onclick="state.creatorFilter='${v}';renderMainOnly()">${l}</button>`).join("")}</div><div class="table-wrap"><table><thead><tr><th>${t("title")}</th><th>${t("category")}</th><th>${t("status")}</th><th>Visibility</th><th>${t("price")}</th><th>${t("actions")}</th></tr></thead><tbody>${mine.map(p=>`<tr><td><div class="userline"><span style="font-size:23px">${p.icon}</span><strong>${esc(p.title)}</strong></div></td><td>${esc(p.category)}</td><td>${statusPill(p.status)}</td><td>${p.visibility==="private"?t("private"):(state.lang==="vi"?"Công khai":"Public")}</td><td>${p.price?money(p.price):t("free")}</td><td><div class="row"><button class="outline" onclick="editPodcast(${p.id})">${t("edit")}</button><button class="outline" onclick="manageEpisodes(${p.id})">♫</button><button class="danger" onclick="deletePodcast(${p.id})">×</button></div></td></tr>`).join("")||`<tr><td colspan="6">${t("noData")}</td></tr>`}</tbody></table></div>`}
function episodesPage(){const mine=state.podcasts.filter(p=>p.authorId===currentUserId());return `${pageHead("EPISODE WORKSPACE",t("episodes"),state.lang==="vi"?"Thêm và quản lý các tập thuộc podcast của bạn.":"Add and manage episodes for your podcasts.")}<div class="grid grid-2">${mine.map(p=>`<div class="card"><div class="between"><h3>${esc(p.title)}</h3><span class="pill">${p.episodes.length} episodes</span></div>${p.episodes.map(e=>`<div class="notice"><span>♫</span><div style="flex:1"><strong>${esc(e.title)}</strong><p>${formatTime(e.duration)}</p></div><button class="outline" onclick="editEpisode(${p.id},${e.id})">✎</button><button class="danger" onclick="deleteEpisode(${p.id},${e.id})">×</button></div>`).join("")}<button class="primary" style="margin-top:10px" onclick="addEpisode(${p.id})">＋ ${state.lang==="vi"?"Thêm tập":"Add episode"}</button></div>`).join("")}</div>`}
function revenuePage(){const earnings=creatorEarnings(11);const allTx=creatorAllTransactions(11).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));return `${pageHead("CREATOR EARNINGS",t("revenue"),state.lang==="vi"?"Doanh thu chỉ tính từ giao dịch của podcast An Nhiên. Tiền khả dụng được cập nhật sau mỗi lần thanh toán thành công.":"Revenue includes only An Nhiên's podcast sales. Available balance updates after successful payments.")}<div class="grid grid-3">${statCard("↗",money(earnings.gross),state.lang==="vi"?"Tổng doanh thu":"Gross revenue",state.lang==="vi"?"Từ các đơn thành công":"Successful sales only")}${statCard("⌁",money(earnings.fee),state.lang==="vi"?"Phí nền tảng":"Platform fee",`${state.feeRate}%`)}${statCard("♡",money(earnings.net),state.lang==="vi"?"Doanh thu thực nhận":"Net earnings",state.lang==="vi"?"Sau khi trừ phí":"After platform fee")}</div><section class="section"><div class="split"><div class="card"><h3>${state.lang==="vi"?"Số dư khả dụng của An Nhiên":"An Nhiên's available balance"}</h3><div class="stat-num" style="font-size:34px">${money(earnings.available)}</div><p>${state.lang==="vi"?"Ngưỡng rút tiền":"Withdrawal threshold"}: ${money(state.minimumWithdrawal)}</p><p class="meta">${state.lang==="vi"?"Tiền từ giao dịch thành công được cộng vào ví sau khi trừ phí nền tảng.":"Successful sales are credited after deducting the platform fee."}</p><button class="primary" onclick="requestWithdrawal()" ${earnings.available<state.minimumWithdrawal?"disabled":""}>↗ ${state.lang==="vi"?"Rút tiền":"Withdraw funds"}</button></div><div class="card"><h3>${state.lang==="vi"?"Cách tiền được ghi nhận":"How earnings are credited"}</h3><div class="notice"><span>1</span><div><strong>${state.lang==="vi"?"Người nghe thanh toán":"Listener pays"}</strong><p>${state.lang==="vi"?"Cổng thanh toán mô phỏng tự trả về kết quả.":"The simulated payment gateway returns a result automatically."}</p></div></div><div class="notice"><span>2</span><div><strong>Platform fee · ${state.feeRate}%</strong><p>${state.lang==="vi"?"Phí được trừ tự động từ giao dịch thành công.":"The fee is deducted automatically from successful transactions."}</p></div></div><div class="notice"><span>3</span><div><strong>${state.lang==="vi"?"Cộng vào ví tác giả":"Credit creator wallet"}</strong><p>${state.lang==="vi"?"Số dư cập nhật ngay trong prototype.":"The balance updates immediately in this prototype."}</p></div></div></div></div></section><section class="section">${sectionHead((state.lang==="vi"?"Lịch sử giao dịch podcast của An Nhiên":"An Nhiên's podcast transactions")+(allTx.length>10?(state.lang==="vi"?` (10 gần nhất / ${allTx.length})`:` (latest 10 of ${allTx.length})`):""))}<div class="table-wrap"><table><thead><tr><th>ID</th><th>${state.lang==="vi"?"Podcast":"Podcast"}</th><th>${state.lang==="vi"?"Số tiền":"Amount"}</th><th>${state.lang==="vi"?"Ngày":"Date"}</th><th>${state.lang==="vi"?"Trạng thái":"Status"}</th><th>${state.lang==="vi"?"Lý do nếu thất bại":"Failure reason"}</th></tr></thead><tbody>${allTx.slice(0,10).map(x=>`<tr><td>${esc(x.id)}</td><td>${esc(x.podcast)}</td><td>${money(x.amount)}</td><td>${esc(x.date)}</td><td>${statusPill(x.status)}</td><td>${x.status==="failed"?esc(x.reason|| (state.lang==="vi"?"Không có lý do chi tiết":"No detailed reason")):"—"}</td></tr>`).join("")||`<tr><td colspan="6">${t("noData")}</td></tr>`}</tbody></table></div></section><section class="section">${sectionHead(state.lang==="vi"?"Lịch sử rút tiền":"Withdrawal history")}<div class="table-wrap"><table><thead><tr><th>ID</th><th>${state.lang==="vi"?"Số tiền":"Amount"}</th><th>${state.lang==="vi"?"Ngày":"Date"}</th><th>${state.lang==="vi"?"Trạng thái":"Status"}</th><th>${state.lang==="vi"?"Tài khoản nhận":"Account"}</th><th>${state.lang==="vi"?"Lý do nếu thất bại":"Failure reason"}</th></tr></thead><tbody>${state.withdrawals.filter(w=>w.creatorId===11).map(w=>`<tr><td>${esc(w.id)}</td><td>${money(w.amount)}</td><td>${esc(w.date)}</td><td>${statusPill(w.status)}</td><td>${esc(w.account||"—")}</td><td>${w.status==="failed"?esc(w.reason||"—"):"—"}</td></tr>`).join("")||`<tr><td colspan="6">${t("noData")}</td></tr>`}</tbody></table></div></section>`}

ass="grid grid-3"><div class="card"><div class="stat-icon">◷</div><h3>${state.podcasts.filter(p=>p.status==="pending").length} ${state.lang==="vi"?"podcast chờ duyệt":"podcasts pending"}</h3><button class="outline" onclick="navigate('moderation')">${state.lang==="vi"?"Mở hàng đợi":"Open queue"} →</button></div><div class="card"><div class="stat-icon">⚑</div><h3>${state.reports.filter(r=>r.status==="new").length} ${state.lang==="vi"?"báo cáo mới":"new reports"}</h3><button class="outline" onclick="navigate('reports')">${state.lang==="vi"?"Xem báo cáo":"Review reports"} →</button></div><div class="card"><div class="stat-icon">⚠</div><h3>${state.errors.filter(e=>e.status==="new").length} ${state.lang==="vi"?"cảnh báo mới":"new alerts"}</h3><button class="outline" onclick="navigate('errors')">${state.lang==="vi"?"Xem cảnh báo":"View alerts"} →</button></div></div></section>`}

function startAudio(url){if(audioEl){audioEl.pause();audioEl.src=""}audioEl=new Audio(url);audioEl.volume=Number(document.getElementById("volume")?.value||.8);audioEl.playbackRate=Number(document.getElementById("speed")?.value||1);audioEl.onloadedmetadata=()=>updatePlayer();audioEl.ontimeupdate=()=>{state.position=audioEl.currentTime;updatePlayer();if(Math.floor(state.position)%10===0)persist()};audioEl.onended=()=>{state.playing=false;updatePlayer()};audioEl.play().catch(()=>{state.playing=false;toast("Trình duyệt chưa phát được file này. Hãy thử chọn file audio khác.","error");updatePlayer()})}
function listenPodcast(id,episodeId){const p=state.podcasts.find(p=>p.id===id);if(!p)return;if(p.hidden&&state.role!=="admin"&&p.authorId!==currentUserId()){toast(state.lang==="vi"?"Nội dung này đã bị ẩn bởi admin.":"This content has been hidden by an admin.","error");return}if(!canListen(p)){buyPodcast(id);return}const e=p.episodes.find(e=>e.id===episodeId)||p.episodes[0];if(!e){toast("Podcast chưa có tập audio.","error");return}state.currentPodcast=id;state.currentEpisode=e.id;state.position=0;state.playing=true;if(state.role==="admin"){p.adminPreviewed=true;p.adminPreviewedAt=new Date().toISOString()}else{state.history=[{podcastId:id,episodeId:e.id,at:new Date().toISOString()},...state.history.filter(h=>h.podcastId!==id)].slice(0,50);p.listeners=(p.listeners||0)+1;}const source=e.fileData||p.audioData;if(e.audioKey){const epId=e.id;if(audioEl){audioEl.pause();audioEl.src="";audioEl=null}clearInterval(playTimer);idbGet(e.audioKey).then(blob=>{if(state.currentEpisode!==epId)return;if(!blob){state.playing=false;toast(state.lang==="vi"?"Không tìm thấy file audio của tập này trong trình duyệt.":"This episode's audio file was not found in the browser.","error");updatePlayer();return}if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(blob);startAudio(objectUrl)}).catch(()=>{state.playing=false;toast(state.lang==="vi"?"Không đọc được file audio.":"Could not read the audio file.","error");updatePlayer()})}else if(source){try{if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=source.startsWith("blob:")?source:URL.createObjectURL(dataURLToBlob(source));startAudio(objectUrl)}catch(err){toast("Không thể phát file audio này.","error");state.playing=false}}else{if(audioEl){audioEl.pause();audioEl=null}toast(state.lang==="vi"?"Đang phát bản demo minh họa — chưa gắn nguồn audio cho tập này.":"Playing demo preview — no audio source is attached to this episode.");startSimulatedPlayer()}persist();updatePlayer()}
function startSimulatedPlayer(){clearInterval(playTimer);playTimer=setInterval(()=>{if(state.playing&&!audioEl){state.position+=1;updatePlayer();if(state.position>=300){state.position=0;state.playing=false;updatePlayer()}}},1000)}
function togglePlay(){if(!state.currentPodcast){listenPodcast(1);return}if(audioEl){if(state.playing)audioEl.pause();else audioEl.play().catch(()=>toast("Không phát được audio.","error"));state.playing=!state.playing}else{state.playing=!state.playing;startSimulatedPlayer()}updatePlayer()}
function seekBy(sec){seekTo((state.position+sec)/Math.max(1,currentDuration())*100)}
function seekTo(v){const dur=currentDuration();state.position=dur*Number(v)/100;if(audioEl)audioEl.currentTime=state.position;updatePlayer()}
function currentDuration(){const p=state.podcasts.find(p=>p.id===state.currentPodcast);const e=p?.episodes.find(e=>e.id===state.currentEpisode);return audioEl&&Number.isFinite(audioEl.duration)?audioEl.duration:(e?.duration||300)}
function formatTime(s){s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function updatePlayer(){const p=state.podcasts.find(p=>p.id===state.currentPodcast);const e=p?.episodes.find(e=>e.id===state.currentEpisode);document.getElementById("playerTitle").textContent=p?(e?.title||podcastTitle(p)):(state.lang==="vi"?"Chọn một podcast để bắt đầu":"Choose a podcast to begin");document.getElementById("playerAuthor").textContent=p?p.author:"Vonica · your listening space";document.getElementById("playerArt").textContent=p?.icon||"🎧";document.getElementById("playBtn").textContent=state.playing?"Ⅱ":"▶";const dur=currentDuration();document.getElementById("currentTime").textContent=formatTime(state.position);document.getElementById("duration").textContent=formatTime(dur);document.getElementById("seek").value=Math.min(100,state.position/dur*100||0)}
function changeSpeed(v){if(audioEl)audioEl.playbackRate=Number(v);toast("Playback speed: "+v+"×")}
function changeVolume(v){if(audioEl)audioEl.volume=Number(v)}
function toggleFavorite(id){state.favorites=state.favorites.includes(id)?state.favorites.filter(x=>x!==id):[...state.favorites,id];persist();render();toast(state.favorites.includes(id)?(state.lang==="vi"?"Đã thêm vào yêu thích":"Added to favorites"):(state.lang==="vi"?"Đã bỏ khỏi yêu thích":"Removed from favorites"))}
function toggleFavoriteCurrent(){if(state.currentPodcast)toggleFavorite(state.currentPodcast);else toast(state.lang==="vi"?"Hãy chọn podcast trước nhé.":"Choose a podcast first.")}
function downloadCurrent(){const p=state.podcasts.find(p=>p.id===state.currentPodcast);if(!p){toast("Chưa chọn podcast.","error");return}if(!canAccess(p)){toast(state.lang==="vi"?"Bạn chưa có quyền tải nội dung này.":"You do not have access to download this content.","error");return}const e=p.episodes.find(e=>e.id===state.currentEpisode);if(e?.audioKey){idbGet(e.audioKey).then(b=>{if(!b){toast(state.lang==="vi"?"Không tìm thấy file audio.":"Audio file not found.","error");return}const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=(e.title||"vonica-audio")+audioExt(b.type);a.click();setTimeout(()=>URL.revokeObjectURL(u),4000);state.downloads=state.downloads||[];if(!state.downloads.includes(p.id))state.downloads.push(p.id);persist();toast(state.lang==="vi"?"Đã lưu vào danh sách đã tải":"Added to downloads")});return}if(e?.fileData){const a=document.createElement("a");a.href=e.fileData;a.download=(e.title||"vonica-audio")+".audio";a.click()}else if(p.audioData){const a=document.createElement("a");a.href=p.audioData;a.download=p.title+".audio";a.click()}else{toast(state.lang==="vi"?"Tập demo chưa có file tải xuống.":"This demo episode has no downloadable audio file.","error");return}state.downloads=state.downloads||[];if(!state.downloads.includes(p.id))state.downloads.push(p.id);persist();toast(state.lang==="vi"?"Đã lưu vào danh sách đã tải":"Added to downloads")}

/* ===== Audio storage (IndexedDB) + live recorder ===== */
const MAX_AUDIO_MB=50,MAX_AUDIO=MAX_AUDIO_MB*1024*1024;
let audioMode="file",pendingRec=null,vRec=null;
function audioDB(){return new Promise((res,rej)=>{const r=indexedDB.open("vonica-audio",1);r.onupgradeneeded=()=>r.result.createObjectStore("audio");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(k,blob){try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}const db=await audioDB();return new Promise((res,rej)=>{const tx=db.transaction("audio","readwrite");tx.objectStore("audio").put(blob,k);tx.oncomplete=()=>{db.close();res()};tx.onerror=tx.onabort=()=>{db.close();rej(tx.error)}})}
async function idbGet(k){const db=await audioDB();return new Promise((res,rej)=>{const q=db.transaction("audio","readonly").objectStore("audio").get(k);q.onsuccess=()=>{db.close();res(q.result||null)};q.onerror=()=>{db.close();rej(q.error)}})}
async function idbDel(k){try{const db=await audioDB();const tx=db.transaction("audio","readwrite");tx.objectStore("audio").delete(k);tx.oncomplete=()=>db.close()}catch(_){}}
async function idbClear(){try{const db=await audioDB();const tx=db.transaction("audio","readwrite");tx.objectStore("audio").clear();tx.oncomplete=()=>db.close()}catch(_){}}
function newAudioKey(){return "aud-"+Date.now()+"-"+Math.random().toString(36).slice(2,8)}

function moderatePodcast(id,status){const p=state.podcasts.find(p=>p.id===id);if(!p)return;if(status==="rejected"){openModal(state.lang==="vi"?"Từ chối podcast":"Reject podcast",`<form id="rejectForm" onsubmit="event.preventDefault();finishModeration(${id},'rejected',this.reason.value)"><div class="field"><label>${state.lang==="vi"?"Lý do từ chối":"Reason for rejection"}</label><textarea name="reason" required placeholder="${state.lang==="vi"?"Nhập lý do cụ thể...":"Enter a clear reason..."}"></textarea></div><button class="danger" style="margin-top:14px">${state.lang==="vi"?"Xác nhận từ chối":"Confirm rejection"}</button></form>`)}else finishModeration(id,status,"")}

function completePurchase(id){const p=state.podcasts.find(p=>p.id===id);if(!p)return;if(state.role==="admin"){closeModal();toast(state.lang==="vi"?"Admin không thể thanh toán nội dung.":"Admins cannot purchase content.","error");return}if(!Number.isFinite(p.price)||p.price<=0){closeModal();toast(state.lang==="vi"?"Giá podcast không hợp lệ, không thể thanh toán.":"Invalid podcast price; payment is not possible.","error");return}if(state.transactions.some(x=>x.podcastId===id&&x.status==="success")){state.purchases=state.purchases||[];if(!state.purchases.includes(id))state.purchases.push(id);closeModal();toast(state.lang==="vi"?"Nội dung đã được thanh toán trước đó.":"This content has already been purchased.");return}const sel=document.getElementById("payMethod");const acc=bankList().find(a=>a.id===(sel&&sel.value))||defaultBank();if(!acc){closeModal();toast(state.lang==="vi"?"Hãy liên kết tài khoản ngân hàng trước khi thanh toán.":"Link a bank account before paying.","error");navigate("bank");return}const failureReasons=state.lang==="vi"?["Ngân hàng phát hành thẻ từ chối giao dịch.","Số dư khả dụng không đủ để hoàn tất thanh toán.","Kết nối tới cổng thanh toán bị gián đoạn.","Thông tin thanh toán không hợp lệ.","Cổng thanh toán tạm thời không phản hồi."]:["The issuing bank declined the transaction.","Insufficient available balance to complete payment.","The connection to the payment gateway was interrupted.","Payment details were invalid.","The payment gateway did not respond in time."];const failed=p.authorId===12;const result=failed?"failed":"success";const reason=failed?(state.lang==="vi"?`${acc.bank} từ chối giao dịch (mã lỗi 05 – Do not honor). Tài khoản có thể bị giới hạn thanh toán trực tuyến hoặc vượt hạn mức; hãy liên hệ ngân hàng hoặc chọn tài khoản khác.`:`${acc.bank} declined the transaction (error code 05 – Do not honor). The account may be restricted for online payments or over its limit; contact the bank or choose another account.`):"";const fee=failed? function openReportReview(rid){const vi=state.lang==="vi";const r=state.reports.find(x=>x.id===rid);if(!r)return;const p=state.podcasts.find(x=>x.id===Number(r.podcastId));const room=r.roomId?state.rooms.find(x=>x.id===Number(r.roomId)):null;const others=state.reports.filter(x=>x.id!==r.id&&Number(x.podcastId)===Number(r.podcastId));const revs=p?state.reviews.filter(x=>x.podcastId===p.id).slice(-3).reverse():[];const isNew=r.status==="new";const sum=`<div class="notice"><span>⚑</span><div style="flex:1"><strong>${esc(r.reason)}</strong><p>${vi?"Người báo cáo":"Reporter"}: ${esc(r.reporter)} · ${esc(r.date||"")} · ${statusPill(r.status)}</p></div></div>`;let pod="";if(!p&&room){pod=""}else if(!p){pod=`<div class="notice" style="margin-top:12px"><span>⚠</span><div><strong>${vi?"Podcast không còn tồn tại":"The podcast no longer exists"}</strong><p>${vi?"Không có nội dung để xem. Bạn có thể đóng báo cáo.":"There is nothing to review. You can close the report."}</p></div></div>`}else{pod=`<div class="card" style="margin-top:12px;padding:14px"><div class="userline"><div style="font-size:34px">${esc(p.icon)}</div><div style="flex:1;min-width:0"><strong>${esc(podcastTitle(p))}</strong><small>${esc(p.author)} · ${esc(p.category)}</small></div></div><div class="row" style="margin:10px 0;gap:6px;flex-wrap:wrap"><span class="pill">${p.price?money(p.price):t("free")}</span>${p.visibility==="private"?`<span class="pill yellow">🔒 ${t("private")}</span>`:""}${statusPill(p.status)}${p.hidden?`<span class="pill red">${vi?"Đang bị ẩn":"Hidden"}</span>`:""}<span class="pill green">★ ${p.rating||"—"}</span><span class="pill">${Number(p.listeners||0).toLocaleString()} ${vi?"lượt nghe":"plays"}</span></div>${p.price?`<p class="meta">🛡 ${vi?"Nội dung có phí: admin xem và nghe miễn phí để xem xét, không tạo giao dịch.":"Paid content: admins view and listen for free to review; no transaction is created."}</p>`:""}<p>${esc(podcastDesc(p))}</p><h4 style="margin:14px 0 6px">♫ ${vi?"Các tập":"Ep function notifyReportDecision(r,text){if(r.reporter==="Hà Đỗ")addNotification(state.lang==="vi"?"Báo cáo của bạn đã được xử lý":"Your report was reviewed",`${r.id}: ${text}`,"listener")}
function hideReported(id){const r=state.reports.find(r=>r.id===id);if(!r||r.status!=="new")return;const vi=state.lang==="vi";const note=reportNote();const p=state.podcasts.find(p=>p.id===Number(r.podcastId));const room=r.roomId?state.rooms.find(x=>x.id===Number(r.roomId)):null;r.status="resolved";r.decision="hidden";r.note=note;r.decidedAt=new Date().toISOString();if(room){room.isOpen=false}else if(p){p.hidden=true;addNotification(vi?"Nội dung của bạn bị ẩn sau báo cáo":"Your content was hidden after a report",`“${p.title}”: ${note||r.reason}`,authorRoleOf(p))}notifyReportDecision(r,vi?"Admin đã xử lý nội dung bạn báo cáo.":"An admin acted on the content you reported.");persist();closeModal();render();toast(room?(vi?"Đã đóng phòng theo báo cáo.":"Room closed following report."):(vi?"Đã ẩn nội dung theo báo cáo.":"Content hidden following report."))}
function keepReported(id){const r=state.reports.find(r=>r.id===id);if(!r||r.status!=="new")return;const vi=state.lang==="vi";r.status="resolved";r.decision="kept";r.note=reportNote();r.decidedAt=new Date().toISOString();notifyReportDecision(r,vi?"Admin đã xem xét và giữ nguyên nội dung.":"An admin reviewed the content and kept it.");persist();closeModal();render();toast(vi?"Đã giữ nội dung và đóng báo cáo.":"Content kept and report resolved.")}
function restoreReported(id){const r=state.reports.find(r=>r.id===id);if(!r)return;const p=state.podcasts.find(p=>p.id===Number(r.podcastId));const room=r.roomId?state.rooms.find(x=>x.id===Number(r.roomId)):null;if(room)room.isOpen=true;else if(p)p.hidden=false;r.decision="restored";r.decidedAt=new Date().toISOString();persist();closeModal();render();toast(state.lang==="vi"?"Đã khôi phục nội dung.":"Content restored.")}
function reportRoom(id){const vi=state.lang==="vi";openModal(vi?"Báo cáo phòng":"Report room",`<p>${vi?"Bạn muốn báo cáo phòng này với lý do nào?":"Why are you reporting this room?"}</p><div class="field"><select id="roomReportReason"><option>Spam</option><option>Harassment</option><option>Inappropriate content</option></select></div>`,`<button class="outline" onclick="closeModal()">${t("cancel")}</button><button class="primary" onclick="submitRoomReport(${Number(id)})">${t("submit")}</button>`)}
function submitRoomReport(id){const room=state.rooms.find(r=>r.id===Number(id));if(!room){closeModal();return}state.reports.unshift({id:"RP-"+Date.now().toString().slice(-5),podcastId:Number(room.podcastId)||null,roomId:room.id,reason:"Room: "+document.getElementById("roomReportReason").value,reporter:state.role==="creator"?"An Nhiên":"Hà Đỗ",status:"new",date:new Date().toISOString().slice(0,10)});persist();closeModal();toast(state.lang==="vi"?"Đã gửi báo cáo tới admin.":"Report submitted to admin.")}
function openReport(id){openModal(state.lang==="vi"?"Báo cáo podcast":"Report podcast",`<form onsubmit="event.preventDefault();submitReport(${id},this)"><div class="field"><label>${state.lang==="vi"?"Lý do báo cáo":"Reason"}</label><select name="reason"><option>${state.lang==="vi"?"Nội dung không phù hợp":"Inappropriate content"}</option><option>${state.lang==="vi"?"Thông tin sai lệch":"Misleading information"}</option><option>${state.lang==="vi"?"Vi phạm bản quyền":"Copyright concern"}</option><option>${state.lang==="vi"?"Spam":"Spam"}</option></select></div><button class="primary" style="margin-top:14px">${t("submit")}</button></form>`)}
function submitReport(id,f){state.reports.unshift({id:"RP-"+Date.now().toString().slice(-5),podcastId:id,reason:f.reason.value,reporter:"Hà Đỗ",status:"new",date:new Date().toISOString().slice(0,10)});persist();closeModal();toast(state.lang==="vi"?"Đã gửi báo cáo tới admin.":"Report submitted to admin.")}
function roomCanJoin(r){if(!r)return false;if(!r.podcastId)return true;const p=state.podcasts.find(p=>p.id===Number(r.podcastId));return !!p&&(canAccess(p)||p.authorId===currentUserId()||state.role==="admin")}
function joinPodcastRoom(id){const r=state.rooms.find(r=>r.id===Number(id));if(!r)return;const vi=state.lang==="vi";if(state.role==="admin"){toast(vi?"Admin chỉ xem nội dung để kiểm duyệt, không tham gia phòng thảo luận.":"Admins review content only and do not join discussion rooms.");return}if(r.isOpen===false){toast(vi?"Phòng này đã đóng.":"This room is closed.","error");return}if(!roomCanJoin(r)){toast(vi?"Bạn cần mua podcast này trước khi tham gia phòng thảo luận.":"Purchase this podcast before joining its discussion room.","error");if(r.podcastId)buyPodcast(Number(r.podcastId));return}r.memberIds=r.memberIds||[];const uid=currentUserId();if(!r.memberIds.includes(uid)){if((r.members||0)>=10){toast(vi?"Phòng đã đủ 10 người.":"This room has reached its 10-person limit.","error");return}r.memberIds.push(uid);r.members=Math.max(r.members||0,r.memberIds.length)}openRoom(r.id)}
function closePodcastRoom(id){const r=state.rooms.find(r=>r.id===Number(id));if(!r)return;const p=state.podcasts.find(p=>p.id===Number(r.podcastId));if(r.creatorId!==currentUserId()&&p?.authorId!==currentUserId()){toast(state.lang==="vi"?"Chỉ người tạo phòng hoặc tác giả podcast mới có thể đóng phòng.":"Only the room host or podcast creator can close the room.","error");return}r.isOpen=false;persist();closeModal();render();toast(state.lang==="vi"?"Đã đóng phòng thảo luận.":"Discussion room closed.")}
function openRoom(id){chatRoomId=id;const r=state.rooms.find(r=>r.id===id);if(!r)return;if(r.isOpen===false){toast(state.lang==="vi"?"Phòng này đã đóng.":"This room is closed.","error");return}if(!roomCanJoin(r)){toast(state.lang==="vi"?"Bạn cần mua podcast này để tham gia phòng.":"Purchase this podcast to join its room.","error");return}if(r.podcastId){r.memberIds=r.memberIds||[];const uid=currentUserId();if(!r.memberIds.includes(uid)){if((r.members||0)>=10){toast(state.lang==="vi"?"Phòng đã đủ 10 người.":"This room has reached its 10-person limit.","error");return}r.memberIds.push(uid);r.members=Math.max(r.members||0,r.memberIds.length)}}const vi=state.lang==="vi";const uids=[...new Set(r.chat.map(msgUid).filter(u=>u&&u!==1))];const chips=uids.map(uid=>{const u=userById(uid);return u?`<button type="button" class="chip" onclick="closeModal();openProfile(${u.id})"><span class="avatar">${esc(u.avatar)}</span>${esc(u.name)}</button>`:""}).join(" ");const linkedPodcast=r.podcastId?state.podcasts.find(p=>p.id===Number(r.podcastId)):null;const isHost=r.creatorId===currentUserId()||linkedPodcast?.authorId===currentUserId();const body=`<div class="between"><div><h3 style="margin:0">${esc(r.name)}</h3><p class="meta">${esc(r.topic)} · ${r.members}/10 ${vi?"người":"members"}${linkedPodcast?` · ${vi?"Podcast":"Podcast"}: ${esc(podcastTitle(linkedPodcast))}${r.episodeTitle?` · ${esc(r.episodeTitle)}`:""}`:""}</p></div><span class="pill green">● ${vi?"Đang mở":"Open"}</span></div>${linkedPodcast?`<div class="notice"><span>🎧</span><div style="flex:1"><strong>${esc(podcastTitle(linkedPodcast))}</strong><p>${vi?"Bạn có thể vừa nghe podcast ở trình phát phía dưới vừa trò chuyện tại phòng này.":"Listen to the podcast in the player below while chatting here."}</p></div><button class="outline" onclick="closeModal();listenPodcast(${linkedPodcast.id},${r.episodeId||"undefined"})">▶ ${vi?"Nghe":"Listen"}</button></div>`:""}${chips?`<div style="margin:12px 0 0"><div class="meta" style="margin-bottom:6px">${vi?"Bấm vào tên để xem trang cá nhân, kết bạn và nhắn tin riêng:":"Tap a name to view profile, add friend and message privately:"}</div><div class="row" style="gap:6px;flex-wrap:wrap">${chips}</div></div>`:""}<div id="chatMessages" style="margin:16px 0;max-height:300px;overflow:auto">${r.chat.map(m=>{const uid=msgUid(m);const me=uid===1;const nm=me||!userById(uid)?esc(m.name):`<a href="#" class="ulink" onclick="event.preventDefault();closeModal();openProfile(${uid})">${esc(m.name)}</a>`;return `<div class="room-bubble ${me?"me":""}"><strong>${nm}</strong><br>${esc(m.text)}</div>`}).join("")}</div><form onsubmit="event.preventDefault();sendRoomMessage(this)"><div class="row"><input name="message" required maxlength="300" placeholder="${vi?"Viết tin nhắn...":"Write a message..."}" style="flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);color:var(--text)"><button class="primary">${t("send")} ➤</button></div></form>${isHost&&r.podcastId?`<div style="margin-top:12px;text-align:right"><button type="button" class="outline" onclick="closePodcastRoom(${r.id})">🔒 ${vi?"Đóng phòng":"Close room"}</button></div>`:""}<p class="meta">${vi?"Chat được mô phỏng trong trình duyệt này, không đồng bộ giữa nhiều thiết bị.":"Chat is simulated in this browser and is not synced across devices."}</p>`;openModal("",body)}
function sendRoomMessage(f){const r=state.rooms.find(r=>r.id===chatRoomId);if(!r)return;const uid=currentUserId();const me=userById(uid)||{name:state.role==="creator"?"An Nhiên":state.role==="admin"?"Vonica Admin":"Hà Đỗ"};const msg=f.message.value.trim().slice(0,300);if(!msg)return;if(r.chat.length>100)r.chat.shift();r.chat.push({name:me.name,uid,text:msg});persist();openRoom(chatRoomId)}
function createRoom(podcastId){const vi=state.lang==="vi";const available=state.podcasts.filter(p=>p.status==="approved"&&p.visibility==="public"&&(canAccess(p)||p.authorId===currentUserId()));if(podcastId){const chosen=state.podcasts.find(p=>p.id===Number(podcastId));if(chosen&&!available.some(p=>p.id===chosen.id))available.unshift(chosen)}if(!available.length){toast(vi?"Bạn cần có quyền truy cập podcast trước khi tạo phòng thảo luận.":"You need access to a podcast before creating a discussion room.","error");return}const selected=Number(podcastId)||available[0].id;const options=available.map(p=>`<option value="${p.id}" ${p.id===selected?"selected":""}>${esc(podcastTitle(p))}</option>`).join("");const epOpts=(state.podcasts.find(p=>p.id===selected)?.episodes||[]).map(e=>`<option value="${e.id}">${esc(e.title)}</option>`).join("");openModal(vi?"Tạo phòng thảo luận":"Create discussion room",`<p class="meta">${vi?"Phòng gắn với một podcast cụ thể. Chỉ người có quyền nghe nội dung hoặc tác giả của podcast mới được tham gia.":"Each room is linked to a specific podcast. Only listeners with access and the podcast creator can join."}</p><form onsubmit="event.preventDefault();saveRoom(this)"><div class="field"><label>${vi?"Podcast":"Podcast"}</label><select name="podcastId" id="roomPodcastSelect" required onchange="updateRoomEpisodeOptions(this.value)">${options}</select></div><div class="field" style="margin-top:12px"><label>${vi?"Tập muốn thảo luận":"Episode to discuss"}</label><select name="episodeId" id="roomEpisodeSelect"><option value="0">${vi?"Toàn bộ podcast":"Entire podcast"}</option>${epOpts}</select></div><div class="field" style="margin-top:12px"><label>${vi?"Tên phòng":"Room name"}</label><input name="name" required maxlength="70" placeholder="${vi?"VD: Cùng nghe và chia sẻ cảm nhận":"e.g. Listen and share thoughts"}"></div><div class="field" style="margin-top:12px"><label>${vi?"Chủ đề":"Topic"}</label><select name="topic">${categories.map(c=>`<option ${c===available.find(p=>p.id===selected)?.category?"selected":""}>${c}</option>`).join("")}</select></div><p class="meta">${vi?"Tối đa 10 người/phòng. Phòng mới được mở ngay sau khi tạo.":"Up to 10 people per room. The room opens as soon as it is created."}</p><button class="primary" style="margin-top:14px">＋ ${vi?"Tạo phòng":"Create room"}</button></form>`)}
function updateRoomEpisodeOptions(pid){const p=state.podcasts.find(x=>x.id===Number(pid));const sel=document.getElementById("roomEpisodeSelect");if(!sel||!p)return;sel.innerHTML=`<option value="0">${state.lang==="vi"?"Toàn bộ podcast":"Entire podcast"}</option>`+p.episodes.map(e=>`<option value="${e.id}">${esc(e.title)}</option>`).join("")} 
function saveRoom(f){const vi=state.lang==="vi";const pid=Number(f.podcastId?.value)||0;const p=state.podcasts.find(x=>x.id===pid);if(pid&&(!p||!(canAccess(p)||p.authorId===currentUserId()))){toast(vi?"Bạn chưa có quyền truy cập podcast này.":"You do not have access to this podcast.","error");return}const epId=Number(f.episodeId?.value)||0;const ep=pid?p?.episodes.find(e=>e.id===epId):null;const uid=currentUserId();const me=userById(uid)||{name:state.role==="creator"?"An Nhiên":state.role==="admin"?"Vonica Admin":"Hà Đỗ"};const room={id:Date.now(),name:f.name.value.trim(),topic:f.topic.value,members:1,memberIds:[uid],chat:[],podcastId:pid||null,episodeId:ep?.id||null,episodeTitle:ep?.title||"",creatorId:uid,createdBy:me.name,isOpen:true};state.rooms.unshift(room);persist();closeModal();render();toast(vi?"Đã tạo phòng thảo luận và mở phòng thành công.":"Discussion room created and opened.")}
function createPlaylist(){openModal(state.lang==="vi"?"Tạo playlist":"Create playlist",`<form onsubmit="event.preventDefault();state.playlists.push({id:Date.now(),name:this.name.value.trim(),podcastIds:[]});persist();closeModal();render();toast('Playlist created')"><div class="field"><label>${state.lang==="vi"?"Tên playlist":"Playlist name"}</label><input name="name" required></div><button class="primary" style="margin-top:14px">${state.lang==="vi"?"Tạo":"Create"}</button></form>`)}
function sendVerificationOtp(){const u=state.users.find(u=>u.id===currentUserId())||state.users[0];state.pendingOtp="482619";openModal(state.lang==="vi"?"Xác minh email bằng OTP":"Verify email with OTP",`<div class="notice"><span>✉</span><div><strong>${state.lang==="vi"?"Mã OTP đã được tạo":"OTP generated"}</strong><p>${state.lang==="vi"?"Email nhận mã":"Sent to"}: ${esc(u.email)}</p></div></div><p class="meta">${state.lang==="vi"?"Bản prototype: mã demo của bạn là":"Prototype demo code:"} <strong style="font-size:20px;letter-spacing:4px;color:var(--rose)">482619</strong>. ${state.lang==="vi"?"Email thật chưa được gửi.":"No real email was sent."}</p><form onsubmit="event.preventDefault();verifyOtp(this.code.value)"><div class="field"><label>${state.lang==="vi"?"Nhập mã OTP 6 chữ số":"Enter 6-digit OTP"}</label><input name="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required placeholder="000000"></div><button class="primary" style="margin-top:14px">${state.lang==="vi"?"Xác nhận OTP":"Verify OTP"}</button></form>`)}
function verifyOtp(code){if(String(code).trim()!==state.pendingOtp){toast(state.lang==="vi"?"Mã OTP không chính xác. Vui lòng thử lại.":"Incorrect OTP. Please try again.","error");return}const id=currentUserId();const u=state.users.find(u=>u.id===id);if(state.verificationRequests.some(r=>r.userId===id&&r.status==="pending")){toast(state.lang==="vi"?"OTP hợp lệ; yêu cầu của bạn đang chờ admin duyệt.":"OTP valid; your request is awaiting admin review.");closeModal();return}state.verificationRequests.unshift({id:Date.now(),userId:id,status:"pending",date:new Date().toISOString().slice(0,10),note:state.lang==="vi"?"Email đã xác minh bằng OTP":"Email verified with OTP"});addNotification(state.lang==="vi"?"Xác minh OTP thành công":"OTP verification successful",state.lang==="vi"?`Email ${u?.email||""} đã được xác nhận. Hồ sơ đang chờ admin duyệt.`:`Email ${u?.email||""} confirmed. Profile is awaiting admin review.`,state.role);delete state.pendingOtp;persist();closeModal();render();toast(state.lang==="vi"?"OTP hợp lệ. Đã gửi hồ sơ tới admin duyệt.":"OTP valid. Profile sent to admin for review.")}
function decideVerification(id,ok){const r=state.verificationRequests.find(r=>r.id===id);if(!r)return;r.status=ok?"approved":"rejected";const u=state.users.find(u=>u.id===r.userId);if(u)u.verified=ok;addNotification(ok?"Hồ sơ đã được xác minh":"Yêu cầu xác minh bị từ chối",ok?"Hồ sơ của bạn đã được xác minh.":"Vui lòng cập nhật thông tin hồ sơ.",u?.role||"creator");persist();render();toast(ok?"Profile verified":"Verification rejected")}
function addNotification(title,body,role){state.notifications.unshift({id:Date.now(),title,body,date:new Date().toLocaleString(),read:false,role})}
function markRead(id){const n=state.notifications.find(n=>n.id===id);if(n)n.read=true;persist();render()}
function markAllRead(){state.notifications.forEach(n=>{if(!n.role||n.role===state.role)n.read=true});persist();render()}
const BANKS=["Vietcombank","VietinBank","BIDV","Agribank","Techcombank","MB Bank","ACB","VPBank","TPBank","Sacombank"];
const MAX_BANKS=3;
let bankLinkDraft=null;
function bankPlain(s){return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toUpperCase().replace(/[^A-Z ]/g," ").replace(/\s+/g," ").trim()}
function bankList(role){role=role||state.role;state.bankAccounts=state.bankAccounts||{listener:[],creator:[],admin:[]};if(!Array.isArray(state.bankAccounts[role]))state.bankAccounts[role]=[];return state.bankAccounts[role]}
