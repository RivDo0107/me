function bankHolderGuess(){const u=state.users.find(u=>u.id===currentUserId());return bankPlain(state.role==="creator"?"An Nhiên":state.role==="admin"?"Vonica":(u&&u.name)||"Hà")}
function bankAccountCard(a){const vi=state.lang==="vi";return `<div class="card" style="margin-bottom:14px"><div class="between"><div class="userline"><div style="font-size:30px">▣</div><div><strong>${esc(a.bank)} ••••${esc(a.last4)}</strong><small>${esc(a.holder)} · ${vi?"Liên kết":"Linked"} ${esc(a.linkedAt)}</small></div></div>${a.isDefault?`<span class="pill green">${vi?"Mặc định":"Default"}</span>`:""}</div><div class="row" style="margin-top:14px">${a.isDefault?"":`<button class="outline" onclick="setDefaultBank('${esc(a.id)}')">${vi?"Đặt làm mặc định":"Set as default"}</button>`}<button class="danger" onclick="confirmUnlinkBank('${esc(a.id)}')">${vi?"Hủy liên kết":"Unlink"}</button></div></div>`}
function bankPage(){const vi=state.lang==="vi";const role=state.role;const list=bankList();const sub=role==="creator"?(vi?"Tài khoản nhận tiền khi bạn rút doanh thu từ ví.":"The account that receives your wallet withdrawals."):role==="admin"?(vi?"Tài khoản nhận phí nền tảng thu từ mỗi giao dịch thành công.":"The account that receives platform fees from successful sales."):(vi?"Liên kết tài khoản ngân hàng để thanh toán podcast trả phí.":"Link a bank account to pay for premium podcasts.");let extra="";if(role==="creator"){const e=creatorEarnings(11);extra=`<div class="card" style="margin-bottom:14px"><h3>↗ ${vi?"Số dư có thể rút":"Withdrawable balance"}</h3><h2 style="margin:6px 0">${money(e.available)}</h2><p class="meta">${vi?"Khi rút tiền, bạn chọn tài khoản nhận trong danh sách đã liên kết.":"When withdrawing, you pick the receiving account from your linked list."}</p><button class="outline" onclick="navigate('revenue')">${vi?"Đến ví & doanh thu":"Go to wallet"}</button></div>`}else if(role==="admin"){const fee=state.transactions.filter(x=>x.status==="success").reduce((a,x)=>a+(Number(x.feeAmount)||0),0);extra=`<div class="card" style="margin-bottom:14px"><h3>⌁ ${vi?"Phí nền tảng đã thu":"Platform fees collected"}</h3><h2 style="margin:6px 0">${money(fee)}</h2><p class="meta">${vi?`Tỷ lệ phí hiện tại: ${Number(state.feeRate)||0}% mỗi giao dịch thành công.`:`Current fee: ${Number(state.feeRate)||0}% per successful sale.`}</p></div>`}else{extra=`<div class="card" style="margin-bottom:14px"><h3>◔ ${vi?"Dùng để thanh toán":"Used for payments"}</h3><p class="meta">${vi?"Khi bấm “Mua ngay”, bạn chọn tài khoản muốn thanh toán. Nếu thanh toán thất bại, bạn không bị trừ tiền.":"When you press “Buy now”, you choose which account to pay with. If payment fails, you are not charged."}</p></div>`}return `${pageHead("BANK ACCOUNT",t("bank"),sub,`<button class="primary" onclick="openBankLink()" ${list.length>=MAX_BANKS?"disabled":""}>＋ ${vi?"Liên kết tài khoản":"Link account"}</button>`)}<div class="grid grid-2"><div>${list.length?list.map(bankAccountCard).join(""):`<div class="card"><div class="notice"><span>▣</span><div><strong>${vi?"Chưa có tài khoản nào được liên kết":"No linked account yet"}</strong><p class="meta">${vi?"Bấm “Liên kết tài khoản” để thêm ngân hàng của bạn.":"Press “Link account” to add your bank."}</p></div></div></div>`}</div><div>${extra}<div class="card"><h3>🔒 ${vi?"Bảo mật":"Security"}</h3><p class="meta">${vi?`Bản demo chỉ lưu tên ngân hàng, 4 số cuối và tên chủ tài khoản, không lưu số tài khoản đầy đủ. Tối đa ${MAX_BANKS} tài khoản mỗi người dùng. Mỗi lần liên kết cần xác thực OTP.`:`The demo stores only the bank name, last 4 digits and holder name, never the full number. Up to ${MAX_BANKS} accounts per user. Each link requires OTP verification.`}</p></div></div></div>`}
function bankErr(m){const b=document.getElementById("bankError");if(b){b.style.display="flex";b.innerHTML=`<span>⚠</span><div>${esc(m)}</div>`}toast(m,"error")}
function openBankLink(){const vi=state.lang==="vi";if(bankList().length>=MAX_BANKS){toast(vi?`Bạn đã liên kết tối đa ${MAX_BANKS} tài khoản.`:`You have reached the limit of ${MAX_BANKS} accounts.`,"error");return}bankLinkDraft=null;openModal(vi?"Liên kết tài khoản ngân hàng":"Link a bank account",`<div id="bankError" role="alert" class="notice" style="display:none;background:#ffe5e8;color:#a02c40"></div><form id="bankForm" novalidate onsubmit="event.preventDefault();startBankLink()"><div class="field"><label for="bkBank">${vi?"Ngân hàng":"Bank"}</label><select id="bkBank">${BANKS.map(b=>`<option>${esc(b)}</option>`).join("")}</select></div><div class="field" style="margin-top:12px"><label for="bkNumber">${vi?"Số tài khoản":"Account number"}</label><input id="bkNumber" inputmode="numeric" maxlength="19" autocomplete="off" placeholder="${vi?"8–16 chữ số":"8–16 digits"}"></div><div class="field" style="margin-top:12px"><label for="bkHolder">${vi?"Tên chủ tài khoản (không dấu, in hoa)":"Account holder (no accents, uppercase)"}</label><input id="bkHolder" autocomplete="off" value="${esc(bankHolderGuess())}"></div><p class="meta" style="margin-top:12px">${vi?"Giao dịch mô phỏng: số tài khoản kết thúc bằng 0000 sẽ báo không tìm thấy tài khoản, kết thúc bằng 9999 sẽ báo sai tên chủ tài khoản. Các số khác liên kết thành công sau khi nhập OTP.":"Simulated: numbers ending in 0000 report account not found, numbers ending in 9999 report a name mismatch. Other numbers link after OTP."}</p><div class="row" style="justify-content:flex-end;margin-top:18px"><button type="button" class="outline" onclick="closeModal()">${t("cancel")}</button><button class="primary" type="submit">${vi?"Tiếp tục":"Continue"} →</button></div></form>`)}
function startBankLink(){const vi=state.lang==="vi";const bank=document.getElementById("bkBank").value;const num=String(document.getElementById("bkNumber").value).replace(/[\s-]/g,"");const holder=bankPlain(document.getElementById("bkHolder").value);if(!BANKS.includes(bank))return bankErr(vi?"Vui lòng chọn ngân hàng.":"Choose a bank.");if(!/^\d{8,16}$/.test(num))return bankErr(vi?"Số tài khoản phải gồm 8–16 chữ số.":"The account number must be 8–16 digits.");if(holder.length<5)return bankErr(vi?"Nhập tên chủ tài khoản (không dấu, in hoa, ít nhất 5 ký tự).":"Enter the account holder name (no accents, at least 5 characters).");if(bankList().some(a=>a.bank===bank&&a.last4===num.slice(-4)))return bankErr(vi?"Tài khoản này đã được liên kết.":"This account is already linked.");let fail="";if(num.endsWith("0000"))fail=vi?`${bank} không tìm thấy số tài khoản này. Hãy kiểm tra lại số tài khoản.`:`${bank} could not find this account number. Please check it.`;else if(num.endsWith("9999"))fail=vi?`Tên chủ tài khoản không khớp với dữ liệu tại ${bank}.`:`The account holder name does not match ${bank}'s records.`;if(fail){bankLinkResult(false,bank,num.slice(-4),holder,fail);return}bankLinkDraft={bank,last4:num.slice(-4),holder,tries:0};askBankOtp()}
function askBankOtp(){const vi=state.lang==="vi";const d=bankLinkDraft;if(!d)return;openModal(vi?"Xác thực OTP":"OTP verification",`<div id="bankError" role="alert" class="notice" style="display:none;background:#ffe5e8;color:#a02c40"></div><p>${vi?`Nhập mã OTP 6 số gửi tới số điện thoại đăng ký với ${esc(d.bank)} (••••${esc(d.last4)}).`:`Enter the 6-digit OTP sent to your phone registered with ${esc(d.bank)} (••••${esc(d.last4)}).`}</p><form onsubmit="event.preventDefault();confirmBankOtp()"><div class="field"><label for="bkOtp">OTP</label><input id="bkOtp" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••••"></div><p class="meta" style="margin-top:10px">${vi?"Mã OTP demo: 123456 (tối đa 3 lần thử).":"Demo OTP: 123456 (up to 3 attempts)."}</p><div class="row" style="justify-content:flex-end;margin-top:18px"><button type="button" class="outline" onclick="bankLinkDraft=null;closeModal()">${t("cancel")}</button><button class="primary" type="submit">${vi?"Xác nhận liên kết":"Confirm link"}</button></div></form>`)}
function confirmBankOtp(){const vi=state.lang==="vi";const d=bankLinkDraft;if(!d)return;const code=String(document.getElementById("bkOtp").value).trim();if(!/^\d{6}$/.test(code))return bankErr(vi?"OTP gồm đúng 6 chữ số.":"The OTP must be exactly 6 digits.");if(code!=="123456"){d.tries++;if(d.tries>=3){bankLinkDraft=null;bankLinkResult(false,d.bank,d.last4,d.holder,vi?"Nhập sai OTP quá 3 lần. Phiên liên kết đã bị hủy, vui lòng thử lại.":"Wrong OTP 3 times. The linking session was cancelled; please try again.");return}return bankErr((vi?"Mã OTP không đúng. Bạn còn ":"Incorrect OTP. Attempts left: ")+(3-d.tries)+(vi?" lần thử.":"."))}const role=state.role;const prev=bankList(role).slice();const acc={id:"BK-"+Date.now().toString(36),bank:d.bank,last4:d.last4,holder:d.holder,linkedAt:new Date().toISOString().slice(0,10),isDefault:prev.length===0};state.bankAccounts[role]=[...prev,acc];if(!persist()){state.bankAccounts[role]=prev;return bankErr(vi?"Không lưu được vì bộ nhớ trình duyệt đã đầy.":"Could not save: browser storage is full.")}bankLinkDraft=null;addNotification(vi?"Liên kết ngân hàng thành công":"Bank account linked",vi?`Đã liên kết ${bankLabel(acc)}.`:`${bankLabel(acc)} has been linked.`,role);persist();closeModal();render();bankLinkResult(true,acc.bank,acc.last4,acc.holder,"")}
function bankLinkResult(ok,bank,last4,holder,reason){const vi=state.lang==="vi";if(!ok){bankLinkDraft=null;addNotification(vi?"Liên kết ngân hàng thất bại":"Bank linking failed",reason,state.role);persist();renderNav()}const purpose=state.role==="creator"?(vi?"Bạn có thể dùng tài khoản này để rút doanh thu.":"You can now use this account to withdraw earnings."):state.role==="admin"?(vi?"Tài khoản này sẽ nhận phí nền tảng.":"This account will receive platform fees."):(vi?"Bạn có thể dùng tài khoản này để thanh toán podcast.":"You can now pay for podcasts with this account.");resultModal(ok,ok?(vi?"Liên kết thành công":"Account linked"):(vi?"Liên kết thất bại":"Linking failed"),[[vi?"Ngân hàng":"Bank",esc(bank)],[vi?"Số tài khoản":"Account","••••"+esc(last4)],[vi?"Chủ tài khoản":"Holder",esc(holder)],[vi?"Trạng thái":"Status",statusPill(ok?"success":"failed")]],ok?purpose:`<strong>${vi?"Lý do lỗi":"Error"}:</strong> ${esc(reason)}`,ok?`<button class="primary" onclick="closeModal()">${vi?"Đóng":"Close"}</button>`:`<button class="outline" onclick="closeModal()">${vi?"Đóng":"Close"}</button><button class="primary" onclick="openBankLink()">↻ ${vi?"Thử lại":"Try again"}</button>`)}
function setDefaultBank(id){const role=state.role;state.bankAccounts[role]=bankList(role).map(a=>({...a,isDefault:a.id===id}));persist();render();toast(state.lang==="vi"?"Đã đặt làm tài khoản mặc định.":"Default account updated.")}
function confirmUnlinkBank(id){const vi=state.lang==="vi";const a=bankList().find(a=>a.id===id);if(!a)return;openModal(vi?"Hủy liên kết tài khoản?":"Unlink this account?",`<p><strong>${esc(bankLabel(a))}</strong> · ${esc(a.holder)}</p><p class="meta">${state.role==="creator"?(vi?"Bạn cần ít nhất một tài khoản liên kết để rút tiền.":"You need at least one linked account to withdraw."):state.role==="admin"?(vi?"Phí nền tảng sẽ không có tài khoản nhận nếu bạn không còn tài khoản nào.":"Platform fees will have no receiving account if none remains."):(vi?"Bạn cần ít nhất một tài khoản liên kết để thanh toán.":"You need at least one linked account to pay.")}</p>`,`<button class="outline" onclick="closeModal()">${t("cancel")}</button><button class="danger" onclick="unlinkBank('${esc(a.id)}')">${vi?"Hủy liên kết":"Unlink"}</button>`)}
function unlinkBank(id){const role=state.role;const a=bankList(role).find(a=>a.id===id);if(!a)return;let rest=bankList(role).filter(x=>x.id!==id);if(rest.length&&!rest.some(x=>x.isDefault))rest=rest.map((x,i)=>({...x,isDefault:i===0}));state.bankAccounts[role]=rest;addNotification(state.lang==="vi"?"Đã hủy liên kết ngân hàng":"Bank account unlinked",bankLabel(a),role);persist();closeModal();render();toast(state.lang==="vi"?"Đã hủy liên kết tài khoản.":"Account unlinked.")}
const FRIEND_DECLINERS=[23];
let dmTyping=null;const dmTimers={};
function uidOf(d){const s=String(d||"");return s.startsWith("u")?Number(s.slice(1))||0:0}
function userById(id){return state.users.find(u=>u.id===Number(id))||null}
function isFriend(id){return (state.friends||[]).includes(Number(id))}
function reqOf(id){return (state.friendReq||[]).find(r=>r.uid===Number(id))||null}
function msgUid(m){return m.uid||(m.name==="Hà"?1:((state.users.find(u=>u.name===m.name)||{}).id||0))}
function dmList(uid){state.dms=state.dms||{};if(!Array.isArray(state.dms[uid]))state.dms[uid]=[];return state.dms[uid]}
function dmUnread(){return Object.values(state.unread||{}).reduce((a,n)=>a+(Number(n)||0),0)}
function reqIncomingCount(){return (state.friendReq||[]).filter(r=>r.dir==="in").length}
function navBadge(key){const n=key==="messages"?dmUnread():key==="friends"?reqIncomingCount():0;return n?`<span class="nbadge">${n}</span>`:""}
function openProfile(id){id=Number(id);if(!userById(id))return;if(id===1){navigate("profile");return}state.page="userProfile";state.detailId="u"+id;persist();render();window.scrollTo({top:0,behavior:"smooth"})}
function openChat(id){id=Number(id);if(!isFriend(id)){toast(state.lang==="vi"?"Hãy kết bạn trước khi nhắn tin.":"Become friends before messaging.","error");return}state.page="messages";state.detailId="u"+id;persist();render();window.scrollTo({top:0,behavior:"smooth"})}
function refreshUI(){if(state.page==="messages"){refreshDm()}else{render()}renderNav()}
function sendFriendRequest(id){id=Number(id);const vi=state.lang==="vi";const u=userById(id);if(state.role!=="listener"||!u||id===1||u.role==="admin"){toast(vi?"Không thể gửi lời mời tới tài khoản này.":"You cannot send a request to this account.","error");return}if(isFriend(id)){toast(vi?"Hai bạn đã là bạn bè.":"You are already friends.");return}const r=reqOf(id);if(r&&r.dir==="in"){acceptFriend(id);return}if(r){toast(vi?"Bạn đã gửi lời mời trước đó, hãy chờ phản hồi.":"Request already sent; please wait for a reply.");return}state.friendReq.push({uid:id,dir:"out",at:Date.now()});persist();render();toast(vi?`Đã gửi lời mời kết bạn tới ${u.name}.`:`Friend request sent to ${u.name}.`);setTimeout(()=>settleFriend(id),3000)}
function settleFriend(id){const r=reqOf(id);if(!r||r.dir!=="out")return;const vi=state.lang==="vi";const u=userById(id);if(!u){state.friendReq=state.friendReq.filter(x=>x.uid!==id);persist();return}state.friendReq=state.friendReq.filter(x=>x.uid!==id);if(FRIEND_DECLINERS.includes(id)){addNotification(vi?"Lời mời chưa được chấp nhận":"Request not accepted",vi?`${u.name} chưa chấp nhận lời mời kết bạn của bạn.`:`${u.name} has not accepted your friend request.`,"listener");toast(vi?`${u.name} chưa chấp nhận lời mời của bạn.`:`${u.name} did not accept your request.`,"error")}else{if(!isFriend(id))state.friends.push(id);dmPush(id,"them",vi?`Chào Hà! Mình là ${u.name}, rất vui được làm quen 😊`:`Hi! I'm ${u.name}, nice to meet you 😊`);if(!(state.page==="messages"&&uidOf(state.detailId)===id))state.unread[id]=(state.unread[id]||0)+1;addNotification(vi?"Kết bạn thành công":"New friend",vi?`${u.name} đã chấp nhận lời mời kết bạn. Hãy nhắn tin cho nhau nhé!`:`${u.name} accepted your friend request. Say hi!`,"listener");toast(vi?`${u.name} đã chấp nhận lời mời kết bạn.`:`${u.name} accepted your request.`)}persist();refreshUI()}
function acceptFriend(id){id=Number(id);const vi=state.lang==="vi";const u=userById(id);const r=reqOf(id);if(!u||!r||r.dir!=="in")return;state.friendReq=state.friendReq.filter(x=>x.uid!==id);if(!isFriend(id))state.friends.push(id);dmPush(id,"them",vi?`Cảm ơn Hà đã chấp nhận! Mình là ${u.name} 👋`:`Thanks for accepting! I'm ${u.name} 👋`);state.unread[id]=(state.unread[id]||0)+1;addNotification(vi?"Kết bạn thành công":"New friend",vi?`Bạn và ${u.name} đã trở thành bạn bè.`:`You and ${u.name} are now friends.`,"listener");persist();refreshUI();toast(vi?`Bạn và ${u.name} đã là bạn bè.`:`You and ${u.name} are now friends.`)}
function declineFriend(id){id=Number(id);state.friendReq=state.friendReq.filter(x=>x.uid!==id);persist();refreshUI();toast(state.lang==="vi"?"Đã từ chối lời mời.":"Request declined.")}
function cancelFriendReq(id){id=Number(id);state.friendReq=state.friendReq.filter(x=>x.uid!==id);persist();refreshUI();toast(state.lang==="vi"?"Đã hủy lời mời kết bạn.":"Request cancelled.")}
function confirmUnfriend(id){id=Number(id);const vi=state.lang==="vi";const u=userById(id);if(!u)return;openModal(vi?"Hủy kết bạn?":"Unfriend?",`<p><strong>${esc(u.name)}</strong></p><p class="meta">${vi?"Cuộc trò chuyện riêng với người này sẽ bị xóa khỏi trình duyệt này.":"Your private conversation with this person will be removed from this browser."}</p>`,`<button class="outline" onclick="closeModal()">${t("cancel")}</button><button class="danger" onclick="unfriend(${id})">${vi?"Hủy kết bạn":"Unfriend"}</button>`)}
function unfriend(id){id=Number(id);state.friends=state.friends.filter(x=>x!==id);if(state.dms)delete state.dms[id];if(state.unread)delete state.unread[id];clearTimeout(dmTimers[id]);if(dmTyping===id)dmTyping=null;persist();closeModal();render();toast(state.lang==="vi"?"Đã hủy kết bạn.":"Unfriended.")}
function dmPush(uid,from,text){const l=dmList(uid);l.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),from,text,at:new Date().toISOString(),seen:from==="them"});if(l.length>200)l.shift()}
function dmMarkRead(uid){state.unread=state.unread||{};state.unread[uid]=0;dmList(uid).forEach(m=>{if(m.from==="them")m.seen=true})}
function dmSend(uid,text){uid=Number(uid);const vi=state.lang==="vi";text=String(text||"").trim();if(!text)return;if(text.length>500){toast(vi?"Tin nhắn tối đa 500 ký tự.":"Messages are limited to 500 characters.","error");return}if(!isFriend(uid)){toast(vi?"Chỉ có thể nhắn tin với bạn bè.":"You can only message friends.","error");return}dmPush(uid,"me",text);persist();refreshDm();scheduleDmReply(uid,text)}
function dmSendFromInput(){const inp=document.getElementById("dmInput");if(!inp)return;const text=inp.value;inp.value="";dmSend(dmActive(),text);inp.focus()}
function dmReplyFor(uid,text){const vi=state.lang==="vi";const u=userById(uid)||{name:"Bạn"};const low=text.toLowerCase();const mine=dmList(uid).filter(m=>m.from==="me").length;if(/chào|xin chào|hello|\bhi\b/.test(low))return vi?`Chào Hà! ${u.name} đây 👋 Hôm nay bạn nghe gì thế?`:`Hi Hà! It's ${u.name} 👋 What are you listening to today?`;if(/cảm ơn|thanks/.test(low))return vi?"Không có gì nha 😊":"You're welcome 😊";if(/podcast|nghe|tập|episode/.test(low)){const ps=state.podcasts.filter(p=>p.status==="approved");const p=ps[mine%Math.max(1,ps.length)];if(p)return vi?`Dạo này mình hay nghe “${podcastTitle(p)}”, hợp để nghe buổi tối lắm đó!`:`Lately I've been listening to “${podcastTitle(p)}” – great for evenings!`}const pool=vi?["Nghe vậy là mình thích rồi 😄","Hay quá! Kể thêm cho mình nghe đi.","Mình cũng thấy thế. Cuối tuần này bạn rảnh không?","Haha đúng rồi 😂","Để mình thử rồi báo lại bạn nhé!"]:["Sounds great 😄","Nice! Tell me more.","Same here. Are you free this weekend?","Haha right 😂","I'll try it and let you know!"];return pool[(mine-1+pool.length)%pool.length]}
function scheduleDmReply(uid,text){clearTimeout(dmTimers[uid]);dmTimers[uid]=setTimeout(()=>{if(!isFriend(uid))return;dmList(uid).forEach(m=>{if(m.from==="me")m.seen=true});dmTyping=uid;persist();refreshDm();dmTimers[uid]=setTimeout(()=>{dmTyping=null;if(!isFriend(uid))return;const reply=dmReplyFor(uid,text);dmPush(uid,"them",reply);const viewing=state.page==="messages"&&dmActive()===uid;if(viewing)dmMarkRead(uid);else{state.unread[uid]=(state.unread[uid]||0)+1;const u=userById(uid);toast((u?u.name:"")+": "+reply)}persist();if(state.page==="messages")refreshDm();else renderNav()},1400)},800)}
function dmOrder(){const fr=(state.friends||[]).map(userById).filter(Boolean);const last=u=>{const l=dmList(u.id);return l.length?l[l.length-1].at:""};return fr.sort((a,b)=>last(b).localeCompare(last(a))||a.name.localeCompare(b.name)).map(u=>u.id)}
function dmActive(){const d=uidOf(state.detailId);if(d&&isFriend(d))return d;return dmOrder()[0]||0}
function dmTime(iso){return new Date(iso).toLocaleTimeString(state.lang==="vi"?"vi-VN":"en-US",{hour:"2-digit",minute:"2-digit"})}
function dmDay(iso){const d=new Date(iso);if(d.toDateString()===new Date().toDateString())return state.lang==="vi"?"Hôm nay":"Today";return d.toLocaleDateString(state.lang==="vi"?"vi-VN":"en-US")}
function dmListHtml(active){const vi=state.lang==="vi";const q=((document.getElementById("dmSearch")||{}).value||"").trim().toLowerCase();const ids=dmOrder().filter(id=>{const u=userById(id);return u&&(!q||u.name.toLowerCase().includes(q))});if(!ids.length)return `<p class="meta" style="padding:14px">${q?(vi?"Không tìm thấy bạn bè nào.":"No friends found."):(vi?"Bạn chưa có bạn bè nào. Hãy kết bạn trong Cộng đồng!":"No friends yet. Make some in Community!")}</p>`;return ids.map(id=>{const u=userById(id);const l=dmList(id);const last=l[l.length-1];const un=(state.unread||{})[id]||0;const pv=last?((last.from==="me"?(vi?"Bạn: ":"You: "):"")+last.text):(vi?"Hãy gửi lời chào 👋":"Say hi 👋");const tm=last?(new Date(last.at).toDateString()===new Date().toDateString()?dmTime(last.at):new Date(last.at).toLocaleDateString(vi?"vi-VN":"en-US")):"";return `<button class="dm-item ${id===active?"active":""} ${un?"unread":""}" onclick="openChat(${id})"><span class="avatar">${esc(u.avatar)}</span><span style="min-width:0;flex:1;text-align:left"><strong style="display:block;font-size:13px">${esc(u.name)}</strong><span class="pv">${esc(pv)}</span></span><span style="display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none"><small class="meta">${esc(tm)}</small>${un?`<span class="dm-dot"></span>`:""}</span></button>`}).join("")}
function dmThreadHtml(uid){const vi=state.lang==="vi";const l=dmList(uid);let last="",html="";l.forEach((m,i)=>{const day=dmDay(m.at);if(day!==last){html+=`<div class="dm-day">${esc(day)}</div>`;last=day}html+=`<div class="dm-b ${m.from==="me"?"me":""}" title="${esc(dmTime(m.at))}">${esc(m.text)}</div>`;if(m.from==="me"&&!l.slice(i+1).some(x=>x.from==="me"))html+=`<div class="dm-meta">${m.seen?(vi?"Đã xem":"Seen"):(vi?"Đã gửi":"Sent")} · ${esc(dmTime(m.at))}</div>`});if(dmTyping===uid)html+=`<div class="dm-b typing"><span></span><span></span><span></span></div>`;if(!l.length)html=`<div class="dm-empty"><div style="font-size:38px">👋</div><p class="meta">${vi?"Hai bạn vừa kết bạn. Hãy gửi lời chào đầu tiên!":"You just became friends. Say hello!"}</p><button class="primary" onclick="dmSend(${uid},'${vi?"Chào bạn 👋":"Hello 👋"}')">${vi?"Chào bạn 👋":"Hello 👋"}</button></div>`;return html}
function refreshDm(){if(state.page!=="messages")return;const uid=dmActive();const L=document.getElementById("dmList"),T=document.getElementById("dmThread");if(uid&&dmUnread()&&(state.unread[uid]||0))dmMarkRead(uid);if(L)L.innerHTML=dmListHtml(uid);if(T){T.innerHTML=dmThreadHtml(uid);T.scrollTop=T.scrollHeight}renderNav()}
function messagesPage(){const vi=state.lang==="vi";const uid=dmActive();if(uid)dmMarkRead(uid);const u=uid?userById(uid):null;const head=u?`<div class="dm-head"><span class="avatar">${esc(u.avatar)}</span><div style="flex:1;min-width:0"><strong>${esc(u.name)}</strong><div class="meta" style="font-size:11px"><span style="color:#2f7a5b">●</span> ${u.id%2?(vi?"Đang hoạt động":"Active now"):(vi?"Hoạt động 15 phút trước":"Active 15 min ago")}</div></div><button class="outline" onclick="openProfile(${u.id})">${vi?"Trang cá nhân":"Profile"}</button></div>`:`<div class="dm-head"><strong>${vi?"Chưa chọn cuộc trò chuyện":"No conversation selected"}</strong></div>`;const compose=u?`<form class="dm-compose" onsubmit="event.preventDefault();dmSendFromInput()"><button type="button" class="softbtn" onclick="dmSend(${u.id},'👍')">👍</button><button type="button" class="softbtn" onclick="dmSend(${u.id},'❤️')">❤️</button><input id="dmInput" maxlength="500" autocomplete="off" placeholder="${vi?"Aa — nhập tin nhắn...":"Aa — type a message..."}"><button class="primary" type="submit">➤</button></form>`:"";return `${pageHead("MESSENGER",t("messages"),vi?"Trò chuyện riêng tư với bạn bè của bạn.":"Private conversations with your friends.",`<button class="outline" onclick="navigate('friends')">♙ ${t("friends")}</button>`)}<div class="dm"><aside class="card dm-list"><input id="dmSearch" class="dm-search" placeholder="${vi?"Tìm bạn bè":"Search friends"}" oninput="document.getElementById('dmList').innerHTML=dmListHtml(dmActive())"><div id="dmList">${dmListHtml(uid)}</div></aside><section class="card dm-thread">${head}<div id="dmThread" class="dm-msgs">${u?dmThreadHtml(uid):`<div class="dm-empty"><p class="meta">${vi?"Chọn một người bạn ở bên trái, hoặc kết bạn thêm trong Cộng đồng.":"Pick a friend on the left, or make friends in Community."}</p><button class="primary" onclick="navigate('community')">${t("community")}</button></div>`}</div>${compose}</section></div>`}

function relButtons(u){const vi=state.lang==="vi";const id=u.id;const r=reqOf(id);if(isFriend(id))return `<span class="pill green">✓ ${vi?"Bạn bè":"Friends"}</span><button class="primary" onclick="openChat(${id})">✉ ${vi?"Nhắn tin":"Message"}</button><button class="outline" onclick="confirmUnfriend(${id})">${vi?"Hủy kết bạn":"Unfriend"}</button>`;if(r&&r.dir==="out")return `<span class="pill yellow">${vi?"Đã gửi lời mời · chờ phản hồi":"Request sent · waiting"}</span><button class="outline" onclick="cancelFriendReq(${id})">${vi?"Hủy lời mời":"Cancel request"}</button>`;if(r&&r.dir==="in")return `<button class="primary" onclick="acceptFriend(${id})">✓ ${vi?"Chấp nhận":"Accept"}</button><button class="outline" onclick="declineFriend(${id})">${vi?"Từ chối":"Decline"}</button>`;return `<button class="primary" onclick="sendFriendRequest(${id})">＋ ${vi?"Kết bạn":"Add friend"}</button><button class="outline" disabled title="${vi?"Kết bạn để nhắn tin":"Become friends to message"}">✉ ${vi?"Nhắn tin":"Message"}</button>`}
function userProfilePage(uid){const vi=state.lang==="vi";const u=userById(uid);if(!u)return `${pageHead("PROFILE",vi?"Không tìm thấy tài khoản":"Account not found","")}<div class="card"><button class="outline" onclick="navigate('community')">← ${t("community")}</button></div>`;if(u.id===1)return profilePage();const rooms=state.rooms.filter(r=>r.chat.some(m=>msgUid(m)===u.id));const pods=u.role==="creator"?state.podcasts.filter(p=>p.authorId===u.id&&p.status==="approved"&&p.visibility==="public"):[];const listening=(u.listening||[]).map(id=>state.podcasts.find(p=>p.id===id)).filter(Boolean);const tags=(u.interests||[]).map(i=>`<span class="pill blue">${esc(i)}</span>`).join(" ");const follow=u.role==="creator"&&state.role==="listener"?`<button class="outline" onclick="toggleFollow(${u.id})">${state.following.includes(u.id)?(vi?"Đang theo dõi":"Following"):t("follow")}</button>`:"";const actions=state.role==="listener"&&u.role!=="admin"?relButtons(u)+follow:"";const podRow=p=>`<div class="userline" style="padding:8px 0;cursor:pointer" onclick="openPodcast(${p.id})"><div style="font-size:26px">${esc(p.icon)}</div><div><strong>${esc(podcastTitle(p))}</strong><small>${esc(p.author)}</small></div></div>`;return `${pageHead("PROFILE",esc(u.name),esc(u.bio||""),`<button class="outline" onclick="navGo(-1)">← ${vi?"Quay lại":"Back"}</button>`)}<div class="card"><div class="userline" style="gap:18px;flex-wrap:wrap"><div class="avatar" style="width:84px;height:84px;font-size:30px">${esc(u.avatar)}</div><div style="flex:1;min-width:200px"><h2 style="margin:0">${esc(u.name)} ${u.verified?"✓":""}</h2><div class="meta">${roleLabel(u.role)} · ${vi?"Tham gia":"Joined"} ${esc(u.joined||"2026")}</div><div style="margin-top:10px">${tags}</div></div><div class="row">${actions}</div></div></div><div class="grid grid-2" style="margin-top:16px">${listening.length?`<div class="card"><h3>♫ ${vi?"Đang nghe gần đây":"Recently listening"}</h3>${listening.map(podRow).join("")}</div>`:""}${pods.length?`<div class="card"><h3>♫ ${vi?"Podcast của tác giả":"Creator's podcasts"}</h3>${pods.map(podRow).join("")}</div>`:""}${rooms.length?`<div class="card"><h3>☕ ${vi?"Hoạt động trong phòng":"Active in rooms"}</h3>${rooms.map(r=>`<div class="between" style="padding:8px 0"><span>${esc(r.name)}</span><button class="outline" onclick="openRoom(${r.id})">${vi?"Vào phòng":"Join"}</button></div>`).join("")}</div>`:""}</div>`}
function friendsPage(){const vi=state.lang==="vi";const inc=(state.friendReq||[]).filter(r=>r.dir==="in").map(r=>userById(r.uid)).filter(Boolean);const out=(state.friendReq||[]).filter(r=>r.dir==="out").map(r=>userById(r.uid)).filter(Boolean);const fr=(state.friends||[]).map(userById).filter(Boolean);const sug=state.users.filter(u=>u.id!==1&&u.role!=="admin"&&!isFriend(u.id)&&!reqOf(u.id)&&u.role==="listener");const empty=m=>`<p class="meta">${m}</p>`;return `${pageHead("FRIENDS",t("friends"),vi?"Kết bạn với những người cùng sở thích và trò chuyện riêng tư.":"Make friends with people who share your taste and chat privately.")}<div class="grid grid-2"><div class="card"><h3>✉ ${vi?"Lời mời kết bạn":"Friend requests"} ${inc.length?`<span class="nbadge">${inc.length}</span>`:""}</h3>${inc.length?inc.map(u=>personRow(u,`<button class="primary" onclick="acceptFriend(${u.id})">✓ ${vi?"Chấp nhận":"Accept"}</button><button class="outline" onclick="declineFriend(${u.id})">${vi?"Từ chối":"Decline"}</button>`)).join(""):empty(vi?"Không có lời mời nào.":"No pending requests.")}${out.length?`<h3 style="margin-top:18px">↗ ${vi?"Lời mời đã gửi":"Sent requests"}</h3>${out.map(u=>personRow(u,`<span class="pill yellow">${vi?"Chờ phản hồi":"Waiting"}</span><button class="outline" onclick="cancelFriendReq(${u.id})">${vi?"Hủy":"Cancel"}</button>`)).join("")}`:""}</div><div class="card"><h3>♙ ${vi?"Bạn bè":"Friends"} (${fr.length})</h3>${fr.length?fr.map(u=>personRow(u,`<button class="primary" onclick="openChat(${u.id})">✉ ${vi?"Nhắn tin":"Message"}</button><button class="outline" onclick="confirmUnfriend(${u.id})">${vi?"Hủy":"Unfriend"}</button>`)).join(""):empty(vi?"Chưa có bạn bè. Hãy xem gợi ý bên dưới hoặc vào một phòng trò chuyện.":"No friends yet. See suggestions below or join a room.")}</div></div><section class="section"><div class="card"><h3>✦ ${vi?"Gợi ý kết bạn":"Suggestions"}</h3>${sug.length?`<div class="grid grid-2">${sug.map(u=>personRow(u,`<button class="primary" onclick="sendFriendRequest(${u.id})">＋ ${vi?"Kết bạn":"Add"}</button>`)).join("")}</div>`:empty(vi?"Bạn đã kết nối với mọi người rồi.":"You are connected with everyone.")}</div></section>`}
function settleOverdueFriendRequests(){(state.friendReq||[]).filter(r=>r.dir==="out").forEach(r=>{const left=3000-(Date.now()-r.at);if(left<=0)settleFriend(r.uid);else setTimeout(()=>settleFriend(r.uid),left)})}
function resultModal(ok,title,rows,note,footer){const col=ok?"#2f7a5b":"#a02c40",bg=ok?"var(--mint)":"#ffe5e8";openModal(title,`<div style="text-align:center;margin:6px 0 16px"><div style="width:64px;height:64px;border-radius:50%;background:${bg};color:${col};display:grid;place-items:center;font-size:32px;font-weight:800;margin:0 auto 10px">${ok?"✓":"✕"}</div></div>${rows.map(([k,v])=>`<div class="between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="meta">${k}</span><strong style="text-align:right">${v}</strong></div>`).join("")}${note?`<div class="notice" style="margin-top:14px;${ok?"":"background:#ffe5e8;color:#a02c40"}"><span>${ok?"ℹ":"⚠"}</span><div>${note}</div></div>`:""}`,footer)}
function showPaymentResult(result,p,reason,creatorNet,tx){const vi=state.lang==="vi";const ok=result==="success";resultModal(ok,ok?(vi?"Thanh toán thành công":"Payment successful"):(vi?"Thanh toán thất bại":"Payment failed"),[[vi?"Mã giao dịch":"Transaction ID",esc(tx.id)],[vi?"Nội dung":"Content",esc(podcastTitle(p))],[vi?"Tác giả":"Creator",esc(p.author)],[vi?"Thanh toán bằng":"Paid with",esc(tx.paymentMethod||"—")],[vi?"Số tiền":"Amount",money(p.price)],[vi?"Trạng thái":"Status",statusPill(result)]],ok?(vi?"Bạn đã có quyền nghe nội dung này. Đây là giao dịch mô phỏng, không có tiền thật được thu.":"You can now listen to this content. This is a simulated transaction; no real money was collected."):`<strong>${vi?"Lý do lỗi":"Error"}:</strong> ${esc(reason)}<br>${vi?"Bạn chưa bị trừ tiền.":"You have not been charged."}`,ok?`<button class="outline" onclick="closeModal()">${vi?"Đóng":"Close"}</button><button class="primary" onclick="closeModal();listenPodcast(${p.id})">▶ ${t("play")}</button>`:`<button class="outline" onclick="closeModal()">${vi?"Đóng":"Close"}</button><button class="primary" onclick="buyPodcast(${p.id})">↻ ${vi?"Thử lại":"Try again"}</button>`)}
function withdrawalFailureReasons(){return state.lang==="vi"?["Ngân hàng nhận tiền từ chối lệnh chuyển: tên chủ tài khoản không khớp với thông tin đã đăng ký.","Hệ thống ngân hàng đang bảo trì nên chưa xử lý được chuyển khoản. Vui lòng thử lại sau.","Số tiền vượt hạn mức nhận chuyển khoản trong ngày của tài khoản ngân hàng."]:["The receiving bank rejected the transfer: the account holder name does not match the registered details.","The bank system is under maintenance and cannot process the transfer. Please try again later.","The amount exceeds the receiving account's daily transfer limit."]}
function requestWithdrawal(){const vi=state.lang==="vi";const available=creatorEarnings(11).available;if(available<state.minimumWithdrawal){toast((vi?"Số dư khả dụng chưa đạt ngưỡng rút tiền. Số dư hiện tại: ":"Available balance is below the withdrawal minimum. Current balance: ")+money(available)+" · "+(vi?"Ngưỡng: ":"Minimum: ")+money(state.minimumWithdrawal),"error");return}const accs=bankList("creator");if(!accs.length){openModal(vi?"Cần liên kết ngân hàng":"Bank account required",`<div class="notice"><span>▣</span><div><strong>${vi?"Bạn chưa liên kết tài khoản nhận tiền":"No receiving account linked"}</strong><p class="meta">${vi?"Hãy liên kết tài khoản ngân hàng trước khi rút tiền. Số dư khả dụng của bạn: ":"Link a bank account before withdrawing. Available balance: "}${money(available)}</p></div></div>`,`<button class="outline" onclick="closeModal()">${t("cancel")}</button><button class="primary" onclick="closeModal();navigate('bank')">▣ ${vi?"Liên kết ngân hàng":"Link bank account"}</button>`);return}const defAcc=defaultBank("creator");const def=Math.min(available,300000);const half=Math.max(state.minimumWithdrawal,Math.floor(available/2/1000)*1000);openModal(vi?"Rút tiền về tài khoản ngân hàng":"Withdraw funds",`<div class="notice" style="background:var(--surface2)"><span>▤</span><div><strong>${vi?"Số dư khả dụng":"Available balance"}: ${money(available)}</strong><p class="meta">${vi?"Tối thiểu mỗi lần rút":"Minimum per withdrawal"}: ${money(state.minimumWithdrawal)}</p></div></div><div id="wdError" role="alert" class="notice" style="display:none;background:#ffe5e8;color:#a02c40"></div><div class="field" style="margin-top:14px"><label for="wdAccount">${vi?"Tài khoản nhận tiền":"Receiving account"}</label><select id="wdAccount">${accs.map(a=>`<option value="${esc(a.id)}"${a.id===defAcc.id?" selected":""}>${esc(bankLabel(a))} · ${esc(a.holder)}</option>`).join("")}</select></div><div class="field" style="margin-top:14px"><label for="wdAmount">${vi?"Số tiền muốn rút (VNĐ)":"Amount to withdraw (VND)"}</label><input id="wdAmount" type="number" min="${state.minimumWithdrawal}" max="${available}" step="1000" value="${def}"></div><div class="row" style="margin-top:10px"><button type="button" class="outline" onclick="document.getElementById('wdAmount').value=${state.minimumWithdrawal}">${vi?"Tối thiểu":"Minimum"}</button><button type="button" class="outline" onclick="document.getElementById('wdAmount').value=${half}">50%</button><button type="button" class="outline" onclick="document.getElementById('wdAmount').value=${available}">${vi?"Rút tất cả":"All"}</button></div><p class="meta" style="margin-top:12px">${vi?"Đây là giao dịch mô phỏng, không có chuyển khoản ngân hàng thật. Hệ thống tự xác định kết quả; nếu thất bại, số dư sẽ không bị trừ.":"This is simulated; no real bank transfer happens. The system decides the result; if it fails, your balance is not deducted."}</p>`,`<button class="outline" onclick="closeModal()">${t("cancel")}</button><button class="primary" onclick="confirmWithdrawal()">↗ ${vi?"Xác nhận rút tiền":"Confirm withdrawal"}</button>`)}
function confirmWithdrawal(){const vi=state.lang==="vi";const available=creatorEarnings(11).available;const amount=Number(document.getElementById("wdAmount").value);const box=document.getElementById("wdError");const err=m=>{box.style.display="flex";box.innerHTML=`<span>⚠</span><div>${esc(m)}</div>`;toast(m,"error")};if(!Number.isFinite(amount)||amount<=0||!Number.isInteger(amount))return err(vi?"Vui lòng nhập số tiền hợp lệ (số nguyên lớn hơn 0).":"Enter a valid whole amount greater than 0.");if(amount<state.minimumWithdrawal)return err((vi?"Số tiền rút tối thiểu là ":"The minimum withdrawal is ")+money(state.minimumWithdrawal)+".");if(amount>available)return err((vi?"Số tiền vượt quá số dư khả dụng ":"Amount exceeds your available balance of ")+money(available)+".");const acc=bankList("creator").find(a=>a.id===(document.getElementById("wdAccount")||{}).value);if(!acc)return err(vi?"Vui lòng chọn tài khoản nhận tiền.":"Choose a receiving account.");const attempts=state.withdrawals.filter(w=>w.creatorId===11).length;const failed=attempts%2===1;const reasons=withdrawalFailureReasons();const reason=failed?reasons[Math.floor(attempts/2)%reasons.length]:"";const w={id:"WD-"+Date.now().toString().slice(-6),creatorId:11,creatorName:"An Nhiên",amount,date:new Date().toISOString().slice(0,10),status:failed?"failed":"completed",reason,method:"Simulated bank transfer",account:bankLabel(acc)};state.withdrawals.unshift(w);if(failed){addNotification(vi?"Rút tiền thất bại":"Withdrawal failed",vi?`Yêu cầu rút ${money(amount)} chưa hoàn tất. Lý do: ${reason} Số dư của bạn không bị trừ.`:`Your ${money(amount)} withdrawal did not complete. Reason: ${reason} Your balance was not deducted.`,"creator");state.errors.unshift({id:"ERR-"+Date.now().toString().slice(-4),type:"Withdrawal failure",message:`${vi?"Rút tiền thất bại":"Withdrawal failed"}: ${reason} · ${w.id} · An Nhiên · ${money(amount)}`,level:"warning",status:"new",date:new Date().toLocaleString(),creatorId:11});addNotification(vi?"Cảnh báo rút tiền":"Withdrawal alert",vi?`Yêu cầu rút tiền ${w.id} của An Nhiên thất bại. Lý do: ${reason}`:`Withdrawal ${w.id} by An Nhiên failed. Reason: ${reason}`,"admin")}else{addNotification(vi?"Rút tiền thành công":"Withdrawal completed",vi?`Đã rút ${money(amount)} về ${bankLabel(acc)} (mô phỏng). Số dư khả dụng còn lại: ${money(creatorEarnings(11).available)}.`:`${money(amount)} withdrawn to your bank account (simulated). Remaining balance: ${money(creatorEarnings(11).available)}.`,"creator")}persist();closeModal();render();const remain=creatorEarnings(11).available;resultModal(!failed,failed?(vi?"Rút tiền thất bại":"Withdrawal failed"):(vi?"Rút tiền thành công":"Withdrawal successful"),[[vi?"Mã giao dịch":"Transaction ID",w.id],[vi?"Số tiền":"Amount",money(amount)],[vi?"Tài khoản nhận":"Receiving account",esc(bankLabel(acc))],[vi?"Trạng thái":"Status",statusPill(w.status)],[vi?"Số dư khả dụng":"Available balance",money(remain)]],failed?`<strong>${vi?"Lý do lỗi":"Error"}:</strong> ${esc(reason)}<br>${vi?"Số dư không bị trừ. Bạn có thể thử rút lại.":"Your balance was not deducted. You can try again."}`:(vi?"Đây là giao dịch mô phỏng, không có chuyển khoản ngân hàng thật.":"This is simulated; no real bank transfer occurred."),failed?`<button class="outline" onclick="closeModal()">${vi?"Đóng":"Close"}</button><button class="primary" onclick="requestWithdrawal()">↻ ${vi?"Thử lại":"Try again"}</button>`:`<button class="primary" onclick="closeModal()">${vi?"Đóng":"Close"}</button>`);toast(failed?(vi?`Rút tiền thất bại: ${reason}`:`Withdrawal failed: ${reason}`):(vi?`Rút ${money(amount)} thành công (mô phỏng).`:`Simulated withdrawal of ${money(amount)} completed.`),failed?"error":"")}
function podcastFormError(errs,mode){const vi=state.lang==="vi";const head=mode==="pending"?(vi?"Gửi kiểm duyệt thất bại":"Submission failed"):(vi?"Không thể lưu bản nháp":"Could not save draft");const box=document.getElementById("podError");if(box){box.style.display="flex";box.innerHTML=`<strong>⚠ ${head}</strong><ul style="margin:6px 0 0 18px;padding:0">${errs.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>`;box.scrollIntoView({block:"center",behavior:"smooth"})}toast(head+": "+errs[0],"error");if(mode==="pending"){addNotification(head,errs.join(" "),"creator");persist();renderNav()}}

function toggleVerified(id){const u=state.users.find(u=>u.id===id);if(!u)return;u.verified=!u.verified;persist();render();toast("Verification status updated")}
function toggleBlocked(id){const u=state.users.find(u=>u.id===id);if(!u)return;u.status=u.status==="blocked"?"active":"blocked";persist();render();toast("Account status updated")}
function addCategory(){openModal(state.lang==="vi"?"Thêm danh mục":"Add category",`<form onsubmit="event.preventDefault();const v=this.name.value.trim();if(v&&!categories.includes(v)){categories.push(v);persist();closeModal();render();toast('Category added')}else toast('Category already exists','error')"><div class="field"><label>Name</label><input name="name" required></div><button class="primary" style="margin-top:14px">${t("save")}</button></form>`)}
function renameCategory(old){openModal(state.lang==="vi"?"Đổi tên danh mục":"Rename category",`<form onsubmit="event.preventDefault();const v=this.name.value.trim();const i=categories.indexOf('${old}');if(v&&i>=0){categories[i]=v;state.podcasts.forEach(p=>{if(p.category==='${old}')p.category=v});persist();closeModal();render();toast('Category updated')}"><div class="field"><label>Name</label><input name="name" required value="${old}"></div><button class="primary" style="margin-top:14px">${t("save")}</button></form>`)}
function removeCategory(c){if(state.podcasts.some(p=>p.category===c)){toast(state.lang==="vi"?"Không thể xóa danh mục đang được podcast sử dụng.":"Cannot delete a category currently in use.","error");return}const i=categories.indexOf(c);if(i>=0)categories.splice(i,1);render();toast("Category removed")}
function simulateError(){const e={id:"ERR-"+Date.now().toString().slice(-5),type:"Frontend simulation",message:"Simulated UI exception / interaction warning",level:"warning",status:"new",date:new Date().toLocaleString()};state.errors.unshift(e);persist();render();toast("Demo error recorded","error")}
function resolveError(id){const e=state.errors.find(e=>e.id===id);if(e)e.status="resolved";persist();render();toast("Alert resolved")}
function filterTable(inputId,tableId){const q=document.getElementById(inputId).value.toLowerCase();document.querySelectorAll(`#${tableId} tbody tr`).forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(q)?"":"none")}
function setLang(l){state.lang=l;persist();render()}
function setTheme(th){state.theme=th;persist();render()}
function resetData(){openModal(state.lang==="vi"?"Khôi phục dữ liệu mẫu?":"Restore sample data?",`<p>${state.lang==="vi"?"Thao tác này sẽ xóa dữ liệu prototype hiện tại trong trình duyệt và khôi phục dữ liệu ban đầu.":"This will replace current local prototype data with the initial sample dataset."}</p>`,`<button class="outline" onclick="closeModal()">${t("cancel")}</button><button class="danger" onclick="localStorage.removeItem('${STORAGE_KEY}');idbClear();state=loadState();closeModal();render();toast('Sample data restored')">${state.lang==="vi"?"Khôi phục":"Restore"}</button>`)}
function renderMainOnlySafe(){renderMainOnly()}
const oldRenderMainOnly=renderMainOnly;
function renderMainOnly(){document.getElementById("main").innerHTML=renderPage();persist()}
window.addEventListener("error",e=>{try{state.errors.unshift({id:"ERR-"+Date.now().toString().slice(-5),type:"Frontend error",message:String(e.message||"Unknown error").slice(0,180),level:"warning",status:"new",date:new Date().toLocaleString()});persist()}catch(_){}});
render();settleOverdueFriendRequests();
</script>
</body>
</html>
